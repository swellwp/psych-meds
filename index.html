<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0e7490">
<title>精神药物服药单</title>
<style>
:root{
  --primary:#0e7490; --primary-dark:#155e75; --primary-light:#ecfeff;
  --bg:#f1f5f9; --card:#ffffff; --line:#cbd5e1; --line-light:#e2e8f0;
  --text:#0f172a; --text-sub:#64748b; --danger:#dc2626; --warn:#d97706; --ok:#16a34a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px}
#app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:90px}

/* ---------- 顶栏 ---------- */
.appbar{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(15,23,42,.2)}
.appbar h1{font-size:18px;font-weight:600;flex:1;letter-spacing:.5px}
.appbar .sub{font-size:12px;opacity:.85;font-weight:400;display:block;margin-top:2px}
.appbar button{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:14px}
.backbtn{font-size:20px;line-height:1;padding:4px 10px 6px}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--primary);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:500;cursor:pointer}
.btn:active{background:var(--primary-dark)}
.btn-block{width:100%}
.btn-ghost{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-danger{background:#fff;color:var(--danger);border:1px solid var(--danger)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px}
.iconbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;color:var(--text);cursor:pointer}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:26px;z-index:30;width:56px;height:56px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:28px;line-height:1;box-shadow:0 4px 14px rgba(14,116,144,.45);cursor:pointer}
.fab:active{background:var(--primary-dark)}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.muted{color:var(--text-sub);font-size:13px}
.warn-tip{margin-top:10px;padding:10px 12px;background:#fff7e6;border:1px solid #ffe1a8;border-radius:9px;color:#8a5a00;font-size:12.5px;line-height:1.6}
.warn-tip b{color:#7a4f00}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500}
.badge-ok{background:#dcfce7;color:#15803d}
.badge-high{background:#fee2e2;color:#b91c1c}
.badge-low{background:#dbeafe;color:#1d4ed8}
.badge-na{background:#f1f5f9;color:#64748b}

/* ---------- 首页 ---------- */
.search-wrap{padding:12px 14px 4px}
.search-wrap input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff}
.pcard{background:#fff;border-radius:12px;margin:8px 14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08);cursor:pointer;border-left:4px solid var(--primary)}
.pcard:active{background:#f8fafc}
.pcard .pname{font-size:17px;font-weight:600}
.pcard .pmeta{color:var(--text-sub);font-size:13px;margin-top:4px}
.pcard .pdiag{margin-top:6px;display:flex;flex-wrap:wrap;gap:5px}
.dtag{background:var(--primary-light);color:var(--primary-dark);border-radius:6px;padding:2px 8px;font-size:12px}
.empty{text-align:center;color:var(--text-sub);padding:60px 20px;font-size:14px}
/* 机构/科室分组 */
.ghead{background:#e2e8f0;border-radius:10px;margin:14px 14px 0;padding:11px 14px;display:flex;align-items:center;cursor:pointer}
.ghead:active{background:#dbe3ec}
.ghead .gc{font-size:12px;color:var(--text-sub);background:#fff;border-radius:10px;padding:1px 9px;margin-right:8px}
.ghead .gn{font-size:15px;font-weight:600;flex:1}
.ghead .gt{color:var(--text-sub);font-size:13px;transition:transform .2s;transform:rotate(0)}
.ghead.collapsed .gt{transform:rotate(-90deg)}
.subhead{display:flex;align-items:center;background:#f1f5f9;margin:8px 14px 0;padding:8px 12px;border-radius:9px;cursor:pointer}
.subhead .sc{font-size:11px;color:var(--text-sub);margin-right:8px}
.subhead .sn{font-size:13px;font-weight:500;flex:1}
.subhead .add{background:var(--primary);color:#fff;border:none;border-radius:8px;font-size:13px;padding:5px 11px;cursor:pointer}
.subhead .add:active{background:var(--primary-dark)}
.ocard{background:#fff;border-radius:9px;padding:6px 9px;font-size:12px;color:var(--text-sub);margin:4px 0 0;display:inline-block}
/* 入院记录 / 床位变更 */
.adm-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fafdfe}
.adm-row .adm-head{display:flex;align-items:center;margin-bottom:8px}
.adm-row .adm-head .t{font-size:13px;font-weight:600;flex:1}
.adm-row .adm-head .x{background:none;border:none;color:#cbd5e1;font-size:16px;cursor:pointer;padding:2px 6px}
.adm-grid{display:flex;gap:8px}
.adm-grid .field{flex:1;margin-bottom:0}
.adm-status.out{color:var(--text-sub)}
.bedtag{display:block;font-size:10px;color:#0e7490;font-weight:600;margin-top:2px}
.status-pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:#dcfce7;color:#15803d;margin-left:6px;vertical-align:1px}
.status-pill.out{background:#f1f5f9;color:#64748b}
/* 门诊/住院类型标签与说明 */
.dtype{font-size:11px;color:var(--primary);background:var(--primary-light);border-radius:6px;padding:1px 7px;margin-left:6px;font-weight:500}
.dtype.op{color:var(--text-sub);background:#f1f5f9}
.opd-note{padding:12px;background:#f8fafc;border:1px dashed var(--line);border-radius:9px;margin-top:4px;line-height:1.6}
/* ---------- 排序分组 / 隐藏 / 换床 ---------- */
.sorthint{font-size:10px;color:var(--text-sub);background:#fff;border-radius:6px;padding:1px 6px;margin-left:6px}
.dgrp{display:flex;align-items:center;gap:7px;margin:10px 18px 2px;font-size:12px;color:var(--text-sub);font-weight:500}
.dgrp:before{content:"";flex:0 0 3px;height:12px;background:var(--primary);border-radius:2px;opacity:.55}
.dgrp .dgc{background:#e2e8f0;border-radius:8px;padding:0 7px;font-size:10px}
.ghead.hidden-head{background:#f1f5f9}
.ghead.hidden-head .gn{color:var(--text-sub);font-weight:500}
.hidden-tip{margin:6px 16px 0;font-size:12px;color:var(--text-sub);line-height:1.6}
.pcard.arch{border-left-color:#cbd5e1;opacity:.72}
.quick-acts{display:flex;gap:8px;padding:10px 14px 0;flex-wrap:wrap}
.quick-acts button{flex:1;min-width:110px;background:#fff;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;font-size:13px;font-weight:500;cursor:pointer}
.quick-acts button:active{background:#f1f5f9}
.arch-banner{margin:10px 14px 0;padding:10px 12px;background:#f1f5f9;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--text-sub);line-height:1.6}
.arch-banner button{margin-left:8px;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.tr-now{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.tr-check{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
.tr-check input{width:17px;height:17px}
.adm-kind{font-size:10px;color:var(--primary);background:var(--primary-light);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:500}
.adm-kind.sm{margin:0 5px 0 0}
.adm-dept{font-size:10px;color:var(--text-sub);background:#f1f5f9;border-radius:6px;padding:1px 6px;margin-left:5px}

/* ---------- 病人页 ---------- */
.pinfo-bar{background:#fff;padding:12px 16px;border-bottom:1px solid var(--line-light)}
.pinfo-bar .n{font-size:18px;font-weight:700}
.pinfo-bar .m{color:var(--text-sub);font-size:13px;margin-top:3px;line-height:1.6}
.tabs{position:sticky;z-index:15;background:#fff;display:flex;border-bottom:1px solid var(--line-light);top:calc(env(safe-area-inset-top,0px) + 66px)}
.tabs button{flex:1;background:none;border:none;padding:12px 0;font-size:15px;color:var(--text-sub);border-bottom:2.5px solid transparent;cursor:pointer}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.toolbar{display:flex;gap:8px;padding:10px 14px;flex-wrap:wrap}

/* ---------- 服药网格 ---------- */
.grid-wrap{margin:0 10px 14px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 240px);-webkit-overflow-scrolling:touch}
table.grid{border-collapse:separate;border-spacing:0;width:100%}
table.grid th,table.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
table.grid thead th{position:sticky;top:0;z-index:8;background:#f0f9ff}
th.dcol{min-width:86px;max-width:128px;padding:6px 4px;cursor:pointer;vertical-align:middle}
th.dcol .dn{font-size:13px;font-weight:600;color:var(--text);line-height:1.25;word-break:break-all}
th.dcol .df{font-size:10px;color:var(--text-sub);margin-top:2px;font-weight:400;white-space:normal;line-height:1.3}
th.corner{position:sticky;left:0;z-index:10;min-width:74px;background:#f0f9ff;font-size:12px;color:var(--text-sub);font-weight:500;padding:4px}
td.datecol{position:sticky;left:0;z-index:6;background:#f8fafc;min-width:44px;text-align:center;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;vertical-align:middle;padding:2px}
td.datecol .wk{display:block;font-size:10px;color:var(--text-sub);font-weight:400;margin-top:2px}
td.slotcol{position:sticky;left:44px;z-index:6;background:#f8fafc;min-width:30px;text-align:center;font-size:12px;color:var(--text-sub);vertical-align:middle}
th.corner2{position:sticky;left:44px;top:0;z-index:10;min-width:30px;background:#f0f9ff}
td.cell{min-width:78px;height:38px;text-align:center;font-size:13px;cursor:pointer;background:#fff;vertical-align:middle}
td.cell:active{background:var(--primary-light)}
td.cell .v{color:var(--text)}
td.cell .stop{color:var(--danger);font-weight:600}
td.cell .same{color:#94a3b8}
td.cell:empty::after{content:""}
/* 停药与血药浓度配色 */
td.cell.stop-cell{background:#fee2e2}
td.cell.stopped-period{background:#fdf2f2}
td.cell.tdm-high{background:#fee2e2}
td.cell.tdm-low{background:#dbeafe}
td.cell.tdm-ok{background:#f0fdf4}
td.cell .tv{font-weight:700;font-size:12px;line-height:1.15}
td.cell .tu{display:block;font-size:9px;color:var(--text-sub);line-height:1.15}
td.cell.tdm-high .tv{color:#b91c1c}
td.cell.tdm-low .tv{color:#1d4ed8}
td.cell.tdm-ok .tv{color:#15803d}
.dn-stop{color:#b91c1c}
.stopbadge{display:inline-block;background:#dc2626;color:#fff;font-size:9px;border-radius:4px;padding:0 4px;margin-left:3px;font-weight:400;vertical-align:1px}
.slot-blood{color:#0e7490 !important;font-weight:600}
.cell-blood-empty{background:#fbfdff}
.grid-legend{padding:0 14px 8px;font-size:12px;color:var(--text-sub);line-height:1.7}
.hidden-meds{margin:6px 14px 14px;padding:10px 12px;background:#f8fafc;border:1px dashed var(--line);border-radius:12px}
.hidden-meds .hm-t{font-size:13px;color:var(--text-sub);margin-right:4px}
.hidden-meds .chip{font-size:13px;padding:5px 11px;background:#fff}
.hidden-meds .hm-tip{font-size:11px;color:var(--text-sub);margin-top:7px}

/* ---------- 底部弹层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .18s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:#fff;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease-out;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.show{transform:translateY(0)}
.sheet-hd{display:flex;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--line-light);position:sticky;top:0;background:#fff;z-index:2}
.sheet-hd .t{font-size:16px;font-weight:600;flex:1}
.sheet-hd .x{background:#f1f5f9;border:none;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--text-sub);cursor:pointer}
.sheet-bd{padding:14px 16px}

/* ---------- 表单 ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text-sub);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:16px;background:#fff;font-family:inherit}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary)}
.frow{display:flex;gap:10px}
.frow .field{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border:1px solid var(--line);border-radius:20px;font-size:14px;background:#fff;cursor:pointer;color:var(--text)}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.dose{background:var(--primary-light);border-color:#a5f3fc;color:var(--primary-dark);font-weight:500}
.chip.warnchip{background:#fff7ed;border-color:#fdba74;color:#c2410c}
.sect-t{font-size:13px;color:var(--text-sub);margin:16px 0 8px;font-weight:500}
.sect-t:first-child{margin-top:0}
/* 录入历史推荐 */
.med-suggest{background:linear-gradient(135deg,#f0f9ff 0%,#faf5ff 100%);border:1px solid #c7d2fe;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.med-suggest.slim{padding:10px 12px;margin-bottom:10px}
.med-suggest .med-sg-combo.on{background:var(--primary);color:#fff}
.med-suggest .med-sg-combo.on .med-sg-cnt{background:rgba(255,255,255,.25);color:#fff}
.med-suggest-t{color:var(--text-sub);font-size:12.5px;margin-bottom:8px}
.med-suggest-t.mt8{margin-top:10px}
.med-suggest-t b{color:var(--primary-dark);font-weight:600}
.med-suggest-fields{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.med-sg-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 10px;background:#fff;border:1px solid #a5b4fc;border-radius:14px;font-size:12.5px;color:#4338ca;cursor:pointer;transition:all .15s}
.med-sg-chip:hover{background:#eef2ff;border-color:#818cf8}
.med-sg-chip:active{transform:scale(.96)}
.med-suggest-combos{display:flex;flex-wrap:wrap;gap:6px}
.med-sg-combo{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;background:#fff;border:1px solid var(--primary);border-radius:18px;font-size:13px;color:var(--primary-dark);cursor:pointer;font-weight:500;transition:all .15s}
.med-sg-combo:hover{background:var(--primary);color:#fff}
.med-sg-combo:active{transform:scale(.96)}
.med-sg-cnt{font-size:11px;background:rgba(99,102,241,.15);color:#4338ca;padding:1px 6px;border-radius:9px;font-weight:600}
.med-sg-combo:hover .med-sg-cnt{background:rgba(255,255,255,.25);color:#fff}
/* 诊断分类（DSM-5 折叠分组） */
.diag-fav{background:linear-gradient(135deg,#f0f9ff 0%,#faf5ff 100%);border:1px solid #c7d2fe;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.diag-fav-t{color:var(--text-sub);font-size:12.5px;margin-bottom:8px}
.diag-fav-items{display:flex;flex-wrap:wrap;gap:8px}
.chip-cnt{font-style:normal;font-size:10.5px;margin-left:4px;opacity:.6;font-weight:600}
.diag-groups{max-height:44vh;overflow:auto;-webkit-overflow-scrolling:touch;padding-right:2px}
.diag-cat-row{border:1px solid var(--line-light);border-radius:10px;margin-bottom:8px;background:#fff;overflow:hidden}
.diag-cat{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--primary-dark);background:#f8fafc}
.diag-cat-name{flex:1;line-height:1.3}
.diag-cat-meta{display:flex;align-items:center;gap:8px;font-weight:500;font-size:12px;color:var(--text-sub)}
.diag-cat-on{color:var(--primary);font-weight:600}
.diag-caret{display:inline-block;transition:transform .15s;font-size:11px;color:var(--text-sub)}
.diag-cat-row.collapsed .diag-caret{transform:rotate(-90deg)}
.diag-items{padding:10px 10px 4px;display:flex;flex-wrap:wrap;gap:8px}
.diag-cat-row.collapsed .diag-items{display:none}
.diag-items .chip{margin-bottom:2px}

/* ---------- 血药浓度 ---------- */
.tdm-card{background:#fff;border-radius:12px;margin:10px 14px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.tdm-card .mn{font-weight:600;font-size:15px}
.tdm-card .range{font-size:12px;color:var(--text-sub);margin-left:8px}
.tdm-rec{display:flex;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line-light);font-size:14px}
.tdm-rec:last-child{border-bottom:none}
.tdm-rec .d{color:var(--text-sub);font-size:13px;width:86px}
.tdm-rec .val{font-weight:600;margin-right:4px}
.tdm-rec .u{color:var(--text-sub);font-size:12px;margin-right:8px}
.tdm-rec .del{margin-left:auto;background:none;border:none;color:#cbd5e1;font-size:16px;cursor:pointer;padding:4px}
.spark{margin-top:8px;background:#f8fafc;border-radius:8px;padding:6px}

/* ---------- 数据管理 ---------- */
.menu-item{display:flex;align-items:center;width:100%;background:#fff;border:1px solid var(--line-light);border-radius:10px;padding:14px;font-size:15px;margin-bottom:10px;cursor:pointer;text-align:left;color:var(--text)}
.menu-item:active{background:#f8fafc}
.menu-item .ic{margin-right:10px;font-size:17px}

/* ---------- 提示 ---------- */
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(15,23,42,.88);color:#fff;padding:10px 20px;border-radius:22px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

/* ---------- 打印 ---------- */
#print-root{display:none}
@media print{
  #app,.overlay,.sheet,.fab,.toast{display:none !important}
  #print-root{display:block;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:10mm}
  #print-root h2{text-align:center;font-size:18px;margin-bottom:6px}
  #print-root .pi{font-size:12px;margin-bottom:8px;line-height:1.8}
  #print-root table{border-collapse:collapse;width:100%;font-size:11px}
  #print-root th,#print-root td{border:1px solid #000;padding:3px 4px;text-align:center}
  #print-root .dc{font-weight:700}
  #print-root .tdm-line{margin-top:8px;font-size:12px;line-height:1.7}
  #print-root td.stopc{background:#fdd5d5;color:#b91c1c;font-weight:700}
  #print-root td.stopped{background:#fdecec}
  #print-root td.high{background:#fdd5d5;color:#b91c1c;font-weight:700}
  #print-root td.low{background:#d3e4fd;color:#1d4ed8;font-weight:700}
  #print-root td.okc{color:#15803d;font-weight:700}
  #print-root .plegend{margin-top:6px;font-size:10px;color:#333}
}
/* ---------- 二维码同步 ---------- */
.qr-box{text-align:center;margin:14px 0;background:#fff;padding:14px;border-radius:12px;border:1px solid var(--line)}
.qr-box svg{width:100%;max-width:260px;height:auto;display:inline-block}
.sync-note{font-size:13px;color:var(--text-sub);line-height:1.7;margin:6px 0 12px}
.sync-note b{color:var(--text)}
.sync-warn{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;border-radius:9px;padding:10px;font-size:13px;line-height:1.6;margin:10px 0}
.code-box{word-break:break-all;font-family:monospace;font-size:11px;background:#f1f5f9;padding:10px;border-radius:8px;max-height:120px;overflow:auto;color:#475569}
.divider{height:1px;background:var(--line-light);margin:10px 0}
/* ---------- 多账号 ---------- */
.acct-screen{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 40px) 22px}
.acct-head h1{font-size:22px;font-weight:700;text-align:center}
.acct-head p{text-align:center;margin-top:10px;line-height:1.7}
.acct-list{margin-top:26px;display:flex;flex-direction:column;gap:12px}
.acct-card{display:flex;align-items:center;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;font-size:17px;cursor:pointer;color:var(--text);box-shadow:0 1px 3px rgba(15,23,42,.06)}
.acct-card:active{background:#f1f5f9}
.acct-name{flex:1;text-align:left;font-weight:600}

.acct-chip{background:rgba(255,255,255,.15) !important;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line-light);border-radius:10px;padding:10px 12px;margin-bottom:10px}

.scale-pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.lv{display:inline-block;padding:2px 10px;border-radius:20px;color:#fff;font-size:12px;margin-left:6px}

.ocr-med .row{display:flex;align-items:center;gap:8px}

/* 运行时药品库：首次用内置默认初始化，之后从 localStorage 读取（用户可维护）。
   加载时会把内置默认中「用户库缺失」的新药合并进来，保证老用户也能看到扩充后的药品，同时保留其自定义药品。 */
var DRUG_LIB = loadDrugLib();
/* 将内置默认药品合并进已存药品库：分类匹配则补齐缺失药品，分类不存在则整类加入；用户自定义药(_user)始终保留 */
function mergeDrugLib(saved,def){
  var out=JSON.parse(JSON.stringify(saved));
  for(var i=0;i<def.length;i++){
    var dcat=def[i],found=null;
    for(var j=0;j<out.length;j++){if(out[j].cat===dcat.cat){found=out[j];break;}}
    if(!found){out.push(JSON.parse(JSON.stringify(dcat)));}
    else{
      for(var k=0;k<dcat.drugs.length;k++){
        var nm=dcat.drugs[k].n,ex=false;
        for(var x=0;x<found.drugs.length;x++){if(found.drugs[x].n===nm){ex=true;break;}}
        if(!ex)found.drugs.push(JSON.parse(JSON.stringify(dcat.drugs[k])));
      }
    }
  }
  return out;
}

/* ===== 安全本地存储封装 =====
   Safari 在「阻止所有 Cookie」或某些隐私设置下访问 localStorage 会直接抛错，
   导致整页白屏（Chrome 不拦，所以正常）。这里捕获异常并退化为内存存储，
   保证应用至少能打开；存储不可用时显示一个提示条。 */
var _memStore={};
var _lsBlocked=false;
function lsProbe(){try{var k="__psy_ls_probe__";localStorage.setItem(k,k);localStorage.removeItem(k);_lsBlocked=false}catch(e){_lsBlocked=true}}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return (k in _memStore)?_memStore[k]:null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}_memStore[k]=v}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}delete _memStore[k]}
function showStorageWarning(){
  if(document.getElementById("ls-warn"))return;
  var d=document.createElement("div");
  d.id="ls-warn";
  d.style.cssText="position:fixed;top:0;left:0;right:0;z-index:9999;background:#fff4e5;color:#8a4b00;font-size:13px;padding:10px 14px;border-bottom:1px solid #f0c36d;line-height:1.5";
  d.innerHTML="⚠️ 当前浏览器（Safari）禁用了本地存储，数据将无法保存、刷新后丢失。请在 iPhone「设置 → Safari → 关闭『阻止所有 Cookie』」，或 Mac「Safari → 设置 → 隐私 → 取消『阻止所有 Cookie』」后，完全关闭 Safari 重新打开。";
  document.body.appendChild(d);
}
function showBootError(err){
  var app=document.getElementById("app");
  if(!app)return;
  app.innerHTML='<div style="padding:24px;font-family:-apple-system,sans-serif;color:#333">'+
    '<h2 style="color:#c0392b">页面加载出错</h2>'+
    '<p>本应用在该浏览器中遇到了脚本错误，已停止渲染。请把下面这段错误信息发给开发者以便修复：</p>'+
    '<pre style="white-space:pre-wrap;background:#f6f6f6;padding:12px;border-radius:8px;font-size:12px;overflow:auto">'+esc(String(err&&err.stack||err))+'</pre>'+
    '<p style="color:#666;font-size:13px">若您使用的是 Safari，请先尝试：设置 → Safari → 关闭「阻止所有 Cookie」后重试。</p></div>';
}

function loadDrugLib(){
  try{
    var raw=lsGet("psyMedSheet.druglib.v1");
    if(raw){
      var a=JSON.parse(raw);
      if(Array.isArray(a)&&a.length){
        var merged=mergeDrugLib(a,DRUG_LIB_DEFAULT);
        lsSet("psyMedSheet.druglib.v1",JSON.stringify(merged));
        return merged;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DRUG_LIB_DEFAULT));
}
function saveDrugLib(){lsSet("psyMedSheet.druglib.v1",JSON.stringify(DRUG_LIB))}
/* 把通用名写入用户药品库（仅在库中不存在时），用于持久化自定义药名 */
function ensureDrug(name){
  if(!name)return;
  for(var i=0;i<DRUG_LIB.length;i++)for(var j=0;j<DRUG_LIB[i].drugs.length;j++)if(DRUG_LIB[i].drugs[j].n===name)return;
  var cat=null;for(var k=0;k<DRUG_LIB.length;k++)if(DRUG_LIB[k].cat==="我的药品"){cat=DRUG_LIB[k];break}
  if(!cat){cat={cat:"我的药品",drugs:[]};
    DRUG_LIB.push(cat);
  }
  cat.drugs.push({n:name,d:[],_user:true});
  saveDrugLib();
}
/* 删除用户自定义药品（内置项不可删） */
function delUserDrug(name){
  for(var i=0;i<DRUG_LIB.length;i++)for(var j=0;j<DRUG_LIB[i].drugs.length;j++){
    if(DRUG_LIB[i].drugs[j].n===name&&DRUG_LIB[i].drugs[j]._user){
      DRUG_LIB[i].drugs.splice(j,1);
      if(DRUG_LIB[i].cat==="我的药品"&&DRUG_LIB[i].drugs.length===0)DRUG_LIB.splice(i,1);
      saveDrugLib();return;
    }
  }
}

/* ==================== 通用录入历史推荐引擎 ====================
   所有推荐一律从「当前账号的全部病人数据」实时派生：
   - 部署前录入的历史数据立即生效，不需要迁移
   - 不额外存储、不会重复计数
   - 按账号天然隔离（store.data 本身就是按账号分库的）        */
function topByMap(obj,n){
  var arr=[];for(var k in obj)if(Object.prototype.hasOwnProperty.call(obj,k))arr.push([k,obj[k]]);
  arr.sort(function(a,b){return b[1]-a[1]});return arr.slice(0,n);
}
function sgBump(map,v){if(v==null)return;v=String(v).trim();if(!v)return;map[v]=(map[v]||0)+1}
function sgPatients(){return (store.data&&store.data.patients)?store.data.patients:[]}
/* 通用推荐条：items=[{label,count,attrs:{k:v}}] */
function sgBarHtml(title,items,action,opts){
  if(!items||!items.length)return "";
  opts=opts||{};
  var h='<div class="med-suggest'+(opts.slim?' slim':'')+'">'+
    '<div class="med-suggest-t">'+title+'</div>'+
    '<div class="med-suggest-combos">';
  items.forEach(function(it){
    var at='';for(var k in it.attrs)if(Object.prototype.hasOwnProperty.call(it.attrs,k))at+=' data-'+k+'="'+esc(String(it.attrs[k]))+'"';
    h+='<button type="button" class="med-sg-combo" data-action="'+action+'"'+at+'>'+esc(it.label)+
       (it.count?' <span class="med-sg-cnt">×'+it.count+'</span>':'')+'</button>';
  });
  return h+'</div></div>';
}

/* 从全部病人的服药单实时派生统计（含历史数据），并与增量记录合并 */
function computeMedStats(){
  var map={};
  if(!store.data||!store.data.patients)return map;
  store.data.patients.forEach(function(p){
    (p.meds||[]).forEach(function(m){
      var name=m.name||"";if(!name)return;
      var s=map[name];
      if(!s){s={totals:0,fields:{form:{},strength:{},freq:{},route:{}},combos:{}};map[name]=s;}
      s.totals++;
      function bump(k,v){if(!v)return;var f=s.fields[k];if(!f){f={};s.fields[k]=f;}f[v]=(f[v]||0)+1;}
      bump("form",m.form);bump("strength",m.strength);bump("freq",m.freq);bump("route",m.route);
      var key=[m.form||"",m.strength||"",m.freq||"",m.route||""].join("|");
      var c=s.combos[key];if(!c){c={count:0,lastTs:0};s.combos[key]=c;}
      c.count++;
    });
  });
  return map;
}
function getMedSuggestion(name){
  if(!store.data)return null;
  // 推荐完全从全部病人的服药单实时派生（含部署前的历史数据）
  var map=computeMedStats();
  var s=map[name];
  if(!s||s.totals<1)return null;
  var combos=topByMap(s.combos,6);
  // 按使用次数排序（取前 3 个最常用组合）
  var scored=combos.map(function(c){
    return {key:c[0],count:c[1].count,score:c[1].count,parts:c[0].split("|")};
  });
  scored.sort(function(a,b){return b.score-a.score});
  var topCombos=scored.slice(0,3);
  var topForm=topByMap(s.fields.form||{},1);
  var topStrength=topByMap(s.fields.strength||{},1);
  var topFreq=topByMap(s.fields.freq||{},1);
  var topRoute=topByMap(s.fields.route||{},1);
  return {totals:s.totals,topCombos:topCombos,
    topForm:topForm[0]?topForm[0][0]:"",
    topStrength:topStrength[0]?topStrength[0][0]:"",
    topFreq:topFreq[0]?topFreq[0][0]:"",
    topRoute:topRoute[0]?topRoute[0][0]:""};
}
/* 加药推荐：优先按录入历史，按疾病诊断类别推荐药物
   - 聚合「同诊断类别」其他病人的用药频次（同类别加权）
   - 本人既往用药强烈加权（优先根据录入历史）
   - 排除已在当前服药单的药物；无诊断时回退到全局高频用药 */
function getMedRecommendByDiag(p){
  if(!store.data||!store.data.patients)return [];
  var idx=diagCatIndex();
  function catsOf(pt){var c={};(pt.diagnoses||[]).forEach(function(d){if(idx[d])c[idx[d]]=1;});return c;}
  var catCount={};
  sgPatients().forEach(function(pt){
    var cats=catsOf(pt);if(!Object.keys(cats).length)return;
    var drugs={};(pt.meds||[]).forEach(function(m){if(m.name)drugs[m.name]=1;});
    for(var cat in cats){
      if(!catCount[cat])catCount[cat]={};
      for(var nm in drugs)catCount[cat][nm]=(catCount[cat][nm]||0)+1;
    }
  });
  var pcats=catsOf(p);
  var map={};
  for(var cat in catCount){
    var boost=pcats[cat]?4:1;
    for(var nm in catCount[cat])map[nm]=(map[nm]||0)+catCount[cat][nm]*boost;
  }
  (p.meds||[]).forEach(function(m){if(m.name)map[m.name]=(map[m.name]||0)+5;}); /* 本人既往用药优先 */
  var cur={};(p.meds||[]).forEach(function(m){if(m.name)cur[m.name]=1;});
  var recs=topByMap(map,12).map(function(e){return {name:e[0],count:e[1]};}).filter(function(r){return !cur[r.name];});
  if(!recs.length){
    /* 无诊断时，回退到全局最常用药物 */
    var stats=computeMedStats();var g={};
    for(var n in stats)g[n]=stats[n].totals;
    recs=topByMap(g,8).map(function(e){return {name:e[0],count:e[1]};}).filter(function(r){return !cur[r.name];});
  }
  return recs.slice(0,8);
}
function fmtComboParts(parts){
  var form=parts[0]||"", strength=parts[1]||"", freq=parts[2]||"", route=parts[3]||"";
  var bits=[];
  if(strength)bits.push(strength);
  if(form)bits.push(form);
  if(freq){
    var fs=freq.split(" ")[0];
    if(fs)bits.push(fs);
  }
  if(route)bits.push(route);
  return bits.join(" · ")||"(空)";
}

function findDrug(name){for(var i=0;i<DRUG_LIB.length;i++){for(var j=0;j<DRUG_LIB[i].drugs.length;j++){if(DRUG_LIB[i].drugs[j].n===name)return DRUG_LIB[i].drugs[j]}}return null}
/* 列标题完整文本：通用名 + 规格 + 剂型 */
function medLabel(m){
  var s=m.name||"";
  if(m.strength)s+=" "+m.strength;
  if(m.form)s+=" "+m.form;
  return s;
}
/* 列标题第二行（频率/方式下方）：规格 剂型 频率首词 服药时机 方式，紧凑拼接 */
function medSub(m){
  var parts=[];
  if(m.strength)parts.push(m.strength);
  if(m.form)parts.push(m.form);
  var f=(m.freq||"").split(" ")[0];
  if(f)parts.push(f);
  var tm=(m.freq||"").match(/（(.+?)）/);
  if(tm&&tm[1])parts.push(tm[1]);
  if(m.route)parts.push(m.route);
  return parts.join(" ");
}

var OLD_KEY="psyMedSheet.v1";
var ACC_KEY="psyMedSheet.accounts.v1";
var accounts={
  list:[], current:null,
  load:function(){
    try{var raw=lsGet(ACC_KEY);if(raw){var o=JSON.parse(raw);this.list=o.list||[];this.current=o.current||null}}catch(e){this.list=[];this.current=null}
    if(this.current&&!this.get(this.current))this.current=null;
  },
  get:function(id){for(var i=0;i<this.list.length;i++)if(this.list[i].id===id)return this.list[i];return null},
  save:function(){lsSet(ACC_KEY,JSON.stringify({list:this.list,current:this.current}))},
  add:function(name,pin){var a={id:uid(),name:name,pin:pin||""};this.list.push(a);this.current=a.id;this.save();return a},
  del:function(id){lsDel(this.dataKey(id));this.list=this.list.filter(function(x){return x.id!==id});if(this.current===id)this.current=null;this.save()},
  setPin:function(id,pin){var a=this.get(id);if(a){a.pin=pin||"";this.save()}},
  dataKey:function(id){return "psyMedSheet.acct."+id}
};

/* ==================== 数据存储（按账号隔离） ==================== */
var store={
  data:null,
  load:function(){
    if(!accounts.current){this.data=null;return}
    var raw=lsGet(accounts.dataKey(accounts.current));
    this.data=null;
    if(raw){try{this.data=JSON.parse(raw)}catch(e){this.data=null}}
    if(!this.data||!this.data.patients)this.data={hospital:"",patients:[],orgs:[],ocr:null};
    if(!this.data.orgs)this.data.orgs=[];
    if(!this.data.ocr)this.data.ocr=null;
    this.migrate();
  },
  save:function(){
    if(!accounts.current||!this.data)return;
    this.data.ts=Date.now();
    lsSet(accounts.dataKey(accounts.current),JSON.stringify(this.data));
  },
  migrate:function(){
    var ps=this.data.patients||[];
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      if(!p.assessments)p.assessments=[];
      if(!p.admissions){
        p.admissions=[{id:uid(),bed:p.bed||"",admit:p.admit||"",status:"在院",discharge:""}];
      }
      if(p.archived==null)p.archived=false;
      /* 入院记录补齐「所属机构/科室」与「记录类型」，用于换床 / 转科的完整轨迹追溯。
         历史数据：前一条已结束（出院/死亡/转院）则本条视为新入院，否则视为换床。 */
      for(var ai=0;ai<p.admissions.length;ai++){
        var a=p.admissions[ai];
        if(!a.id)a.id=uid();
        if(a.orgId===undefined||a.orgId===null)a.orgId=p.orgId||null;
        if(a.deptId===undefined||a.deptId===null)a.deptId=p.deptId||null;
        if(!a.kind){
          var prev=ai>0?p.admissions[ai-1]:null;
          var ended=prev&&(prev.status==="出院"||prev.status==="死亡"||prev.status==="转院");
          a.kind=(!prev||ended)?"入院":"换床";
        }
      }
      if(p.meds)for(var k=0;k<p.meds.length;k++){
        if(p.meds[k].form==null)p.meds[k].form="";
        if(p.meds[k].strength==null)p.meds[k].strength="";
      }
    }
  }
};

/* ==================== 入院记录 / 床位 ==================== */
/* 病案号是病人的稳定标识；床位属于某次入院记录，可随换床/出院/死亡变更 */
function admissionsOf(p){return p.admissions||[]}
function currentAdmission(p){
  var ads=admissionsOf(p);
  if(!ads.length)return null;
  /* 取最后一条「在院」记录：换床 / 转科会把旧记录关闭并追加新记录 */
  for(var i=ads.length-1;i>=0;i--)if(ads[i].status==="在院")return ads[i];
  var sorted=ads.slice().sort(function(a,b){return (b.admit||"")<(a.admit||"")?-1:1});
  return sorted[0];
}
function currentBed(p){var a=currentAdmission(p);return a?a.bed:""}
function currentStatus(p){var a=currentAdmission(p);return a?a.status:""}
/* 真正的「入院次数」：只数 kind 为入院的记录，换床 / 转科不计入 */
function admitCount(p){
  var ads=admissionsOf(p),n=0;
  for(var i=0;i<ads.length;i++)if((ads[i].kind||"入院")==="入院")n++;
  return n||ads.length;
}
function isArchived(p){return !!p.archived}
/* 某日期所处的床位（按入院—出院区间匹配，无匹配返回空） */
function bedAtDate(p,date){
  var ads=admissionsOf(p),best=null;
  for(var i=0;i<ads.length;i++){
    var a=ads[i];
    if(!a.admit||a.admit>date)continue;
    if(a.discharge&&a.discharge<date)continue;
    if(!best||(a.admit||"")>(best.admit||""))best=a;
  }
  return best?best.bed:"";
}
/* ==================== 排序：住院按床位、门诊按病种 ==================== */
/* 床位号自然排序：把数字段与非数字段拆开，数字段按数值比较。
   于是 3062 < 3100（而非字符串意义上的 3100 < 3062），A5 < A12，空床位排最后。 */
function bedTokens(b){
  var out=[],re=/(\d+|\D+)/g,m;
  while((m=re.exec(b||""))!==null){
    if(/^\d+$/.test(m[0]))out.push({n:parseInt(m[0],10),s:m[0]});
    else out.push({n:null,s:m[0].toLowerCase()});
  }
  return out;
}
function cmpBed(b1,b2){
  var e1=!String(b1||"").trim(),e2=!String(b2||"").trim();
  if(e1&&e2)return 0;
  if(e1)return 1;
  if(e2)return -1;
  var t1=bedTokens(b1),t2=bedTokens(b2),n=Math.max(t1.length,t2.length);
  for(var i=0;i<n;i++){
    var a=t1[i],b=t2[i];
    if(!a)return -1;
    if(!b)return 1;
    if(a.n!==null&&b.n!==null){if(a.n!==b.n)return a.n-b.n}
    else if(a.s!==b.s)return a.s<b.s?-1:1;
  }
  return 0;
}
/* 姓名排序：优先按中文拼音（localeCompare zh），环境不支持时退化为码点序 */
function cmpName(p1,p2){
  var a=(p1&&p1.name)||"",b=(p2&&p2.name)||"";
  try{var r=a.localeCompare(b,"zh-Hans-CN",{sensitivity:"base"});if(r)return r}
  catch(e){if(a!==b)return a<b?-1:1}
  return 0;
}
/* 门诊按疾病大类归集：诊断 → DSM-5 大类 */
var _diagCatIdx=null;
function diagCatIndex(){
  if(_diagCatIdx)return _diagCatIdx;
  _diagCatIdx={};
  DIAG_GROUPS.forEach(function(g){g.items.forEach(function(d){_diagCatIdx[d]=g.cat})});
  return _diagCatIdx;
}
function diagCatOf(p){
  var ds=(p&&p.diagnoses)||[];
  if(!ds.length)return "未填写诊断";
  var idx=diagCatIndex();
  for(var i=0;i<ds.length;i++){if(idx[ds[i]])return idx[ds[i]]}
  return "其他诊断";
}
/* 住院：在院优先 → 床位号自然序 → 姓名 */
function sortInpatients(list){
  return list.slice().sort(function(a,b){
    var sa=currentStatus(a)==="在院"?0:1,sb=currentStatus(b)==="在院"?0:1;
    if(sa!==sb)return sa-sb;
    var c=cmpBed(currentBed(a),currentBed(b));
    if(c)return c;
    return cmpName(a,b);
  });
}
/* 门诊：按疾病大类归集（沿用 DSM-5 章节顺序），组内按姓名排序 */
function groupOutpatients(list){
  var map={},cats=[];
  list.forEach(function(p){
    var c=diagCatOf(p);
    if(!map[c]){map[c]=[];cats.push(c)}
    map[c].push(p);
  });
  var order={};DIAG_GROUPS.forEach(function(g,i){order[g.cat]=i});
  cats.sort(function(a,b){
    var ia=a==="其他诊断"?980:(a==="未填写诊断"?990:(order[a]!=null?order[a]:900));
    var ib=b==="其他诊断"?980:(b==="未填写诊断"?990:(order[b]!=null?order[b]:900));
    if(ia!==ib)return ia-ib;
    return a<b?-1:1;
  });
  return cats.map(function(c){return {cat:c,list:map[c].slice().sort(cmpName)}});
}
/* 科室按名称里的数字自动升序排列（支持阿拉伯数字与中文数字），无数字的科室按名称排在其后 */
var _CN_NUM={零:0,一:1,二:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10,十一:11,十二:12,十三:13,十四:14,十五:15,十六:16,十七:17,十八:18,十九:19,二十:20};
function deptNum(d){
  var s=d&&d.name?d.name:"";
  var m=/(零|一|二|三|四|五|六|七|八|九|十|十一|十二|十三|十四|十五|十六|十七|十八|十九|二十|\d+)/.exec(s);
  if(!m)return null;
  if(_CN_NUM[m[1]]!=null)return _CN_NUM[m[1]];
  if(/^\d+$/.test(m[1]))return parseInt(m[1],10);
  return null;
}
function cmpDept(a,b){
  var na=deptNum(a),nb=deptNum(b);
  if(na==null&&nb==null)return (a.name||"")<(b.name||"")?-1:1;
  if(na==null)return 1;          // 带数字的科室排前面
  if(nb==null)return -1;
  if(na!==nb)return na-nb;
  return (a.name||"")<(b.name||"")?-1:1;
}
/* 病人的管理类型：住院（带床位/入院记录）或门诊（按随访管理，无床位）。
   优先取所属科室的类型；未分组病人取自身存储的 careType（默认住院）。 */
function getCareType(p){
  var d=getDept(p.orgId,p.deptId);
  if(d)return d.type||"inpatient";
  return p.careType||"inpatient";
}
/* 表单中：根据当前选中的科室，找到对应的科室对象（含类型） */
function getDeptSelected(){
  var os=$("#pf-org"),ds=$("#pf-dept");
  if(!ds||!ds.value||ds.value==="__new__")return null;
  var oName=os?os.value:"";
  var org=oName&&oName!=="__new__"?getOrgByName(oName):null;
  if(!org)return null;
  for(var i=0;i<org.depts.length;i++){if(org.depts[i].name===ds.value)return org.depts[i]}
  return null;
}
/* 根据当前科室选择刷新「管理类型」控件与入院记录区块的显隐 */
function updateCareUI(){
  var ds=$("#pf-dept"),ctInput=$("#pf-caretype"),ctg=$("#care-type-group"),aw=$("#adm-wrap"),on=$("#opd-note");
  if(!ds||!ctInput)return;
  var dval=ds.value,ct;
  if(dval&&dval!=="__new__"){
    var d=getDeptSelected();ct=(d&&d.type)||"inpatient";if(ctg)ctg.style.display="none";
  }else if(dval==="__new__"){
    var dtc=document.querySelector("#pf-dept-type .chip.on");ct=dtc?dtc.getAttribute("data-v"):"inpatient";if(ctg)ctg.style.display="none";
  }else{
    var st=document.querySelector("#care-type-group .chip.on");ct=st?st.getAttribute("data-v"):"inpatient";if(ctg)ctg.style.display="block";
  }
  ctInput.value=ct;
  if(ct==="outpatient"){if(aw)aw.style.display="none";if(on)on.style.display="block"}
  else{if(aw)aw.style.display="block";if(on)on.style.display="none"}
}

/* ==================== 机构/科室 ==================== */
function getOrg(id){for(var i=0;i<store.data.orgs.length;i++){if(store.data.orgs[i].id===id)return store.data.orgs[i]}return null}
function getOrgByName(name){name=(name||"").trim();for(var i=0;i<store.data.orgs.length;i++){if(store.data.orgs[i].name===name)return store.data.orgs[i]}return null}
function getDept(orgId,deptId){var o=getOrg(orgId);if(!o)return null;for(var i=0;i<o.depts.length;i++){if(o.depts[i].id===deptId)return o.depts[i]}return null}
function ensureOrg(name){
  name=(name||"").trim();if(!name)return null;
  var ex=getOrgByName(name);
  if(ex)return ex;
  var o={id:uid(),name:name,depts:[]};
  store.data.orgs.push(o);store.save();
  return o;
}
function ensureDept(org,name,type){
  name=(name||"").trim();if(!org||!name)return null;
  for(var i=0;i<org.depts.length;i++){if(org.depts[i].name===name)return org.depts[i]}
  var d={id:uid(),name:name,type:type||"inpatient"};org.depts.push(d);store.save();
  return d;
}
function fillDepts(orgName){
  var co=getOrgByName(orgName);
  var opts='<option value="">请选择科室/病区</option>';
  if(co){for(var i=0;i<co.depts.length;i++)opts+='<option value="'+esc(co.depts[i].name)+'">'+esc(co.depts[i].name)+'</option>'}
  opts+='<option value="__new__">＋ 新建/其他科室…</option>';
  var ds=$("#pf-dept");if(ds)ds.innerHTML=opts;
}

/* 一组病人的卡片区：住院按床位排序，门诊按疾病大类归集后按姓名排序。
   type：inpatient / outpatient / mixed（未分科室时同时含两类） */
function listBodyHTML(list,type,showOrg){
  if(!list||!list.length)return "";
  var out="";
  if(type==="none"){   /* 保持调用方给定的顺序 */
    list.forEach(function(p){out+=pcardHTML(p,showOrg)});
    return out;
  }
  if(type==="mixed"){
    var inp=[],opd=[];
    list.forEach(function(p){(getCareType(p)==="outpatient"?opd:inp).push(p)});
    out+=listBodyHTML(inp,"inpatient",showOrg);
    out+=listBodyHTML(opd,"outpatient",showOrg);
    return out;
  }
  if(type==="outpatient"){
    var grps=groupOutpatients(list);
    grps.forEach(function(g){
      out+='<div class="dgrp"><span class="dgc">'+g.list.length+'</span>'+esc(g.cat)+'</div>';
      g.list.forEach(function(p){out+=pcardHTML(p,showOrg)});
    });
    return out;
  }
  sortInpatients(list).forEach(function(p){out+=pcardHTML(p,showOrg)});
  return out;
}
function renderPatientList(){
  var kw=state.search.trim().toLowerCase();
  var all=store.data.patients.slice();
  if(kw){
    var list=all.filter(function(p){
      var bedStr=admissionsOf(p).map(function(a){return a.bed||""}).join(" ").toLowerCase();
      return (p.name||"").toLowerCase().indexOf(kw)>=0||bedStr.indexOf(kw)>=0||
        (p.recordNo||"").toLowerCase().indexOf(kw)>=0||
        (p.diagnoses||[]).join(",").toLowerCase().indexOf(kw)>=0||
        (getOrg(p.orgId)?getOrg(p.orgId).name:"").toLowerCase().indexOf(kw)>=0||
        (getDept(p.orgId,p.deptId)?getDept(p.orgId,p.deptId).name:"").toLowerCase().indexOf(kw)>=0;
    });
    /* 搜索时连已隐藏的病人一并检索，但排在后面并加标记 */
    list.sort(function(a,b){
      var aa=isArchived(a)?1:0,ab=isArchived(b)?1:0;
      if(aa!==ab)return aa-ab;
      return cmpName(a,b);
    });
    var h="";
    if(!list.length){h='<div class="empty">未找到匹配的病人</div>'}
    else for(var i=0;i<list.length;i++)h+=pcardHTML(list[i],true);
    $("#plist").innerHTML=h;
    return;
  }
  var active=[],hidden=[];
  all.forEach(function(p){(isArchived(p)?hidden:active).push(p)});
  var orgs=store.data.orgs||[];
  var buckets={};
  var unassigned=[];
  for(var i=0;i<active.length;i++){
    var p=active[i];
    if(!p.orgId||!getOrg(p.orgId)){unassigned.push(p);continue}
    if(!buckets[p.orgId])buckets[p.orgId]={depts:{},undept:[]};
    var b=buckets[p.orgId];
    if(p.deptId&&getDept(p.orgId,p.deptId)){(b.depts[p.deptId]=b.depts[p.deptId]||[]).push(p)}
    else b.undept.push(p);
  }
  var html="";
  for(var oi=0;oi<orgs.length;oi++){
    var org=orgs[oi],b=buckets[org.id];
    if(!b)continue;
    var orgCount=0;for(var k in b.depts)orgCount+=b.depts[k].length;orgCount+=b.undept.length;
    if(!orgCount)continue;
    var okey="org:"+org.id,ocol=state.collapsed[okey];
    html+='<div class="ghead'+(ocol?' collapsed':'')+'" data-action="toggle-org" data-oid="'+org.id+'"><span class="gc">'+orgCount+'</span><span class="gn">'+esc(org.name)+'</span><span class="gt">▾</span></div>';
    if(!ocol){
      var deptsSorted=org.depts.slice().sort(cmpDept);
      for(var di=0;di<deptsSorted.length;di++){
        var dept=deptsSorted[di],dl=b.depts[dept.id];
        if(!dl||!dl.length)continue;
        var dkey="dept:"+org.id+":"+dept.id,dcol=state.collapsed[dkey];
        var isOpd=dept.type==="outpatient";
        var dtag=isOpd?'<span class="dtype op">门诊</span>':'<span class="dtype">住院</span>';
        var dhint=isOpd?'<span class="sorthint">按病种</span>':'<span class="sorthint">按床位</span>';
        html+='<div class="subhead'+(dcol?' collapsed':'')+'" data-action="toggle-dept" data-oid="'+org.id+'" data-did="'+dept.id+'"><span class="sc">'+dl.length+'</span><span class="sn">'+esc(dept.name)+'</span>'+dtag+dhint+'<button class="add" data-action="add-patient-dept" data-org="'+esc(org.name)+'" data-dept="'+esc(dept.name)+'">＋</button></div>';
        if(!dcol)html+=listBodyHTML(dl,isOpd?"outpatient":"inpatient",false);
      }
      if(b.undept.length){
        html+='<div class="subhead"><span class="sc">'+b.undept.length+'</span><span class="sn">未分配科室</span></div>';
        html+=listBodyHTML(b.undept,"mixed",false);
      }
    }
  }
  if(unassigned.length){
    var ukey="org:__none",ucol=state.collapsed[ukey];
    html+='<div class="ghead'+(ucol?' collapsed':'')+'" data-action="toggle-org" data-oid="__none"><span class="gc">'+unassigned.length+'</span><span class="gn">未分组</span><span class="gt">▾</span></div>';
    if(!ucol)html+=listBodyHTML(unassigned,"mixed",true);
  }
  if(hidden.length){
    var hkey="org:__hidden";
    if(state.collapsed[hkey]===undefined)state.collapsed[hkey]=true;   /* 默认收起 */
    var hcol=state.collapsed[hkey];
    html+='<div class="ghead hidden-head'+(hcol?' collapsed':'')+'" data-action="toggle-org" data-oid="__hidden"><span class="gc">'+hidden.length+'</span><span class="gn">已隐藏病人</span><span class="gt">▾</span></div>';
    if(!hcol){
      html+='<div class="hidden-tip">出院 / 死亡后隐藏的病人。记录仍完整保留，点开可查看或恢复显示。</div>';
      html+=listBodyHTML(hidden.slice().sort(function(a,b){return (b.archivedAt||0)-(a.archivedAt||0)}),"none",true);
    }
  }
  if(!html)html='<div class="empty">暂无病人，点击右下角 ＋ 新建</div>';
  $("#plist").innerHTML=html;
}
function pcardHTML(p,showOrg){
  var diags=(p.diagnoses||[]).slice(0,3).map(function(d){return '<span class="dtag">'+esc(d)+'</span>'}).join("");
  var lastRow=p.rows&&p.rows.length?p.rows[p.rows.length-1].date:null;
  var org=getOrg(p.orgId),dept=getDept(p.orgId,p.deptId);
  var cb=currentBed(p),cs=currentStatus(p);
  var orgline="";
  if(showOrg&&(org||dept))orgline='<div class="ocard">'+(org?esc(org.name):"")+(org&&dept?" · ":"")+(dept?esc(dept.name):"")+'</div>';
  var arch=isArchived(p);
  var nAdmit=admitCount(p),nMove=admissionsOf(p).length-nAdmit;
  var moveTip=nMove>0?' · 换床/转科 '+nMove+' 次':'';

    '<div class="row"><span class="pname">'+esc(p.name)+(arch?'<span class="status-pill out">已隐藏</span>':'')+'</span>'+
    '<span class="muted">'+esc(p.gender||"")+' '+(p.age?esc(p.age)+"岁":"")+'</span></div>'+
    (getCareType(p)==="outpatient"
      ?'<div class="pmeta">门诊管理 · 病案号 '+esc(p.recordNo||"—")+'</div>'
      :'<div class="pmeta">床号 '+esc(cb||"—")+(cs&&cs!=="在院"?'<span class="status-pill out">'+esc(cs)+'</span>':'')+' · 病案号 '+esc(p.recordNo||"—")+(nAdmit>1?' · 入院 '+nAdmit+' 次':'')+'</div>')+
    orgline+
    (diags?'<div class="pdiag">'+diags+'</div>':'')+
    '<div class="pmeta mt8">用药 '+(p.meds?p.meds.length:0)+' 种'+(lastRow?' · 最近记录 '+md(lastRow):'')+moveTip+'</div>'+

}

function collectAdmissions(){
  var rows=document.querySelectorAll("#adm-list .adm-row");

  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    var bed=r.querySelector(".adm-bed").value.trim();
    var admit=r.querySelector(".adm-admit").value;
    var status=r.querySelector(".adm-status").value;
    var dis=r.querySelector(".adm-discharge").value;
    if(!bed&&!admit)continue;
    out.push({
      id:r.getAttribute("data-aid")||uid(),
      bed:bed,admit:admit,status:status,discharge:status==="在院"?"":dis,
      orgId:r.getAttribute("data-oid")||null,
      deptId:r.getAttribute("data-did")||null,
      kind:r.getAttribute("data-kind")||"入院"
    });
  }
  if(!out.length)out=[{id:uid(),bed:"",admit:"",status:"在院",discharge:"",orgId:null,deptId:null,kind:"入院"}];
  return out;
}

  var org=ensureOrg(finalOrg),dept=org?ensureDept(org,finalDept,careType):null;
  var p;
  if(pid){p=getPatient(pid);if(!p)return}
  else{p={id:uid(),meds:[],rows:[],tdm:[],createdAt:Date.now()};store.data.patients.push(p)}
  p.name=name;p.recordNo=$("#pf-rec").value.trim();
  p.gender=$("#pf-gender").value;p.age=$("#pf-age").value.trim();

  if(careType==="outpatient")p.admissions=[];else p.admissions=collectAdmissions();
  p.orgId=org?org.id:null;p.deptId=dept?dept.id:null;
  /* 未标注所属科室的记录（新补录的）归到病人当前科室 */
  (p.admissions||[]).forEach(function(a){if(!a.orgId)a.orgId=p.orgId;if(!a.deptId)a.deptId=p.deptId});
  p.diagnoses=diags;touch(p);
  closeSheet();
  /* 状态已结束但仍显示在列表里时，主动询问是否隐藏 */
  var endSt=currentStatus(p);

  if(careType!=="outpatient"&&!p.archived&&(endSt==="出院"||endSt==="死亡"||endSt==="转院")){
    wantHide=confirm("该病人当前状态为「"+endSt+"」。\n是否隐藏其记录？\n\n隐藏后不再出现在科室列表中，全部病历数据仍完整保留，可在首页底部「已隐藏病人」中恢复。");
    if(wantHide){p.archived=true;p.archivedAt=Date.now();p.archiveReason=endSt;store.save()}
  }
  if(wantHide){state.view="home";state.pid=null}
  else if(!pid){state.pid=p.id;state.view="patient";state.tab="grid"}
  render();
  toast(wantHide?"已保存并隐藏":"已保存");
}

function saveTransfer(pid){
  var p=getPatient(pid);if(!p)return;
  var mode=state.trMode||"bed";
  var dEl=$("#tr-date"),date=(dEl&&dEl.value)||today();

    var st=$("#tr-status").value;

    else p.admissions.push({id:uid(),bed:currentBed(p)||"",admit:date,discharge:date,status:st,orgId:p.orgId||null,deptId:p.deptId||null,kind:"入院"});

    touch(p);closeSheet();
    if(hide){state.view="home";state.pid=null}
    render();toast(hide?("已登记"+st+"，记录已隐藏"):("已登记"+st));

  }

  p.admissions.push({id:uid(),bed:bed,admit:date,discharge:"",status:"在院",orgId:tOrgId||null,deptId:tDeptId||null,kind:(mode==="dept"?"转科":"换床")});

/* ---------- 服药单网格 ---------- */
/* 合并用药日期与血药浓度日期为统一时间轴，并推算每种药在各时点的停用状态 */
function buildTimeline(p){
  var dates=p.rows.map(function(r){return r.date});
  (p.tdm||[]).forEach(function(t){if(dates.indexOf(t.date)<0)dates.push(t.date)});
  dates.sort();
  var rowMap={};p.rows.forEach(function(r){rowMap[r.date]=r});
  var tdmMap={};
  (p.tdm||[]).forEach(function(t){
    if(!tdmMap[t.date])tdmMap[t.date]={};
    if(!tdmMap[t.date][t.med])tdmMap[t.date][t.med]=[];
    tdmMap[t.date][t.med].push(t);
  });
  var stopState={};
  for(var i=0;i<p.meds.length;i++){
    var m=p.meds[i],stopped=false,arr=[];
    for(var di=0;di<dates.length;di++){
      var row=rowMap[dates[di]];
      var cells=row&&row.cells?row.cells[m.id]:null;
      if(cells){
        var hs=false,hd=false;
        for(var k=0;k<3;k++){
          var v=cells[SLOTS[k].k];
          if(v==="停")hs=true;else if(v&&v!=="/")hd=true;
        }
        if(hs)stopped=true;
        if(hd)stopped=false;
      }
      arr.push(stopped);
    }
    stopState[m.id]=arr;
  }
  return {dates:dates,rowMap:rowMap,tdmMap:tdmMap,stopState:stopState};
}
/* 血药浓度异常判定：返回 high / low / ok / "" */
function tdmClass(medName,recs){
  var lib=findDrug(medName),worst="";
  for(var i=0;i<recs.length;i++){
    var t=recs[i];
    if(lib&&lib.tdm&&lib.tdm.u===t.u){
      var v=parseFloat(t.value);
      if(!isNaN(v)){
        if(v>lib.tdm.hi)return "high";
        if(v<lib.tdm.lo)worst="low";
        else if(!worst)worst="ok";
      }
    }
  }
  return worst;
}
function renderGridTab(p){
  var h='<div class="toolbar">'+
    '<button class="btn btn-sm" data-action="add-date">＋ 日期</button>'+
    '<button class="btn btn-sm" data-action="add-med">＋ 药物</button>'+
    '<button class="btn btn-sm" data-action="ocr-grid">📷 识别</button>'+
    '<button class="btn btn-sm btn-ghost" data-action="print-grid">打印</button></div>';
  if(!p.meds.length){
    h+='<div class="empty">尚未添加药物<br><br><button class="btn" data-action="add-med">从药品库添加</button></div>';
    return h;
  }
  var meds=p.meds.filter(function(m){return !m.hidden});
  if(!meds.length){
    h+='<div class="empty">所有药物已隐藏，点下方「已隐藏药物」可恢复显示。</div>';
    h+=hiddenMedsHTML(p);
    return h;
  }
  var tl=buildTimeline(p);
  h+='<div class="grid-wrap"><table class="grid"><thead><tr><th class="corner">日期\\时间</th><th class="corner2"></th>';
  for(var i=0;i<meds.length;i++){
    var m=meds[i];
    var isStopped=tl.dates.length&&tl.stopState[m.id][tl.dates.length-1];
    h+='<th class="dcol" data-action="med-head" data-mid="'+m.id+'"><div class="dn'+(isStopped?' dn-stop':'')+'">'+esc(m.name)+(isStopped?'<span class="stopbadge">停</span>':'')+'</div><div class="df">'+esc(medSub(m))+'</div></th>';
  }
  h+='</tr></thead><tbody>';
  if(!tl.dates.length){
    h+='<tr><td colspan="'+(meds.length+2)+'" style="padding:30px;text-align:center;color:var(--text-sub)">暂无记录，点击上方「＋ 日期」开始记录</td></tr>';
  }
  var prevBed="__none__";
  var isInpatient=getCareType(p)==="inpatient";
  for(var di=0;di<tl.dates.length;di++){
    var d=tl.dates[di];
    var row=tl.rowMap[d]||null;
    var rid=row?row.id:("v_"+d);
    var tdmOnDate=tl.tdmMap[d]||null;
    var subRows=tdmOnDate?4:3;
    var bedHere=isInpatient?bedAtDate(p,d):"";
    var showBed=isInpatient&&(di===0||bedHere!==prevBed);
    prevBed=bedHere;
    for(var s=0;s<3;s++){
      var slot=SLOTS[s];
      h+='<tr>';
      if(s===0)h+='<td class="datecol" rowspan="'+subRows+'" data-action="date-cell" data-rid="'+rid+'">'+md(d)+'<span class="wk">'+wk(d)+'</span>'+(showBed&&bedHere?'<span class="bedtag">床'+esc(bedHere)+'</span>':'')+'</td>';
      h+='<td class="slotcol">'+slot.t+'</td>';
      for(var mi=0;mi<meds.length;mi++){
        var med=meds[mi];
        var cell=(row&&row.cells&&row.cells[med.id])?row.cells[med.id][slot.k]:"";
        var cls="v",txt=cell,tdCls="cell";
        if(cell==="停"){cls="stop";txt="停";tdCls+=" stop-cell"}
        else if(cell==="/"){cls="same";txt="/"}
        else if(!cell&&tl.stopState[med.id][di])tdCls+=" stopped-period";
        h+='<td class="'+tdCls+'" data-action="cell" data-rid="'+rid+'" data-mid="'+med.id+'" data-slot="'+slot.k+'">'+(cell?'<span class="'+cls+'">'+esc(txt)+'</span>':'')+'</td>';
      }
      h+='</tr>';
    }
    if(tdmOnDate){
      h+='<tr><td class="slotcol slot-blood">血</td>';
      var seenTdm={};
      for(var bi=0;bi<meds.length;bi++){
        var bmed=meds[bi];
        var recs=tdmOnDate[bmed.name];
        if(recs&&recs.length&&!seenTdm[bmed.name]){
          seenTdm[bmed.name]=true;
          var cls2=tdmClass(bmed.name,recs);
          var bcls=cls2==="high"?" tdm-high":(cls2==="low"?" tdm-low":(cls2==="ok"?" tdm-ok":""));
          var vals=recs.map(function(t){return t.value}).join("/");
          h+='<td class="cell'+bcls+'" data-action="tdm-cell" title="血药浓度"><span class="tv">'+esc(vals)+'</span><span class="tu">'+esc(recs[0].u)+'</span></td>';
        }else{
          h+='<td class="cell cell-blood-empty" data-action="tdm-cell"></td>';
        }
      }
      h+='</tr>';
    }
  }
  h+='</tbody></table></div>';
  h+=hiddenMedsHTML(p);
  h+='<div class="grid-legend">点格子填剂量 · 点药名调频率/方式 · 点日期改/删该日<br>'+
  '<span style="display:inline-block;width:10px;height:10px;background:#fee2e2;border:1px solid #fca5a5;border-radius:2px;margin-right:4px"></span>红底＝停药及停用期间　'+
  '「血」行＝血药浓度：<span style="color:#b91c1c">红=偏高</span> <span style="color:#1d4ed8">蓝=偏低</span> <span style="color:#15803d">绿=正常</span></div>';
  return h;
}

function prevDoseValue(p,mid,slot,curDate){

  }
  return best;
}

    h+='</div>';

          else if(v>lib.tdm.hi)badge='<span class="badge badge-high">偏高</span>';
          else badge='<span class="badge badge-ok">正常</span>';
        }
      }
      h+='<div class="tdm-rec"><span class="d">'+esc(t.date)+'</span>'+
      '<span class="val">'+esc(t.value)+'</span><span class="u">'+esc(t.u)+'</span>'+badge+
      (t.note?'<span class="muted" style="margin-left:6px">'+esc(t.note)+'</span>':'')+
      '<button class="del" data-action="tdm-edit" data-tid="'+t.id+'" style="margin-left:auto" title="编辑">✎</button>'+
      '<button class="del" data-action="tdm-del" data-tid="'+t.id+'" style="margin-left:6px" title="删除">✕</button></div>';
    }
    h+='</div>';
  }
  return h;
}
function sparkline(recs,tdm){
  var W=300,H=56,pad=6;
  var vals=recs.map(function(r){return parseFloat(r.value)}).filter(function(v){return !isNaN(v)});
  if(vals.length<2)return "";
  var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
  if(tdm){min=Math.min(min,tdm.lo);max=Math.max(max,tdm.hi)}
  if(max===min){max=min+1}
  function Y(v){return H-pad-((v-min)/(max-min))*(H-2*pad)}
  var pts=[];
  for(var i=0;i<recs.length;i++){var v=parseFloat(recs[i].value);if(isNaN(v))continue;pts.push([pad+i*(W-2*pad)/(recs.length-1),Y(v)])}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  if(tdm){
    s+='<line x1="0" y1="'+Y(tdm.lo)+'" x2="'+W+'" y2="'+Y(tdm.lo)+'" stroke="#93c5fd" stroke-dasharray="4 3" stroke-width="1"/>';
    s+='<line x1="0" y1="'+Y(tdm.hi)+'" x2="'+W+'" y2="'+Y(tdm.hi)+'" stroke="#fca5a5" stroke-dasharray="4 3" stroke-width="1"/>';
  }
  var path=pts.map(function(p,i){return (i===0?"M":"L")+p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ");
  s+='<path d="'+path+'" fill="none" stroke="#0e7490" stroke-width="2"/>';
  for(var j=0;j<pts.length;j++)s+='<circle cx="'+pts[j][0].toFixed(1)+'" cy="'+pts[j][1].toFixed(1)+'" r="3" fill="#0e7490"/>';
  s+='</svg>';
  return '<div class="spark">'+s+'</div>';
}

  var medNames=[];

function importJSON(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);
      if(!d||!d.patients)throw new Error("bad");
      if(!confirm("导入将覆盖当前全部数据，确定继续？建议先导出备份。"))return;
      store.data=d;store.save();closeSheet();state.view="home";state.pid=null;render();toast("导入成功");
    }catch(e){alert("文件格式不正确，导入失败")}
  };
  rd.readAsText(file);
}
/* ---------- 二维码同步（设备间直传，不经服务器） ---------- */
function syncBaseURL(){
  if(location.protocol==="http:"||location.protocol==="https:")return location.origin+location.pathname;
  return "";
}
function syncCompress(){return LZString.compressToEncodedURIComponent(JSON.stringify(store.data))}
function syncDecompress(s){
  try{
    var json=LZString.decompressFromEncodedURIComponent(s);
    if(!json)return null;
    var d=JSON.parse(json);
    if(!d||!d.patients)return null;
    return d;
  }catch(e){return null}
}
function openSyncGen(){
  var compressed=syncCompress();
  var url=syncBaseURL();
  var payload=url?url+"#sync="+compressed:compressed;
  var h='<div class="sheet-hd"><div class="t">生成同步二维码</div><button class="x" data-action="sheet-close">✕</button></div><div class="sheet-bd">';
  h+='<div class="sync-note">用<b>手机系统相机</b>扫下方二维码，点屏幕顶部出现的横幅即可自动打开本应用并导入。数据不经过任何服务器。</div>';
  var qrOK=false,errMsg="";
  if(url){
    try{
      var qr=qrcode(0,"L");
      qr.addData(payload);
      qr.make();
      h+='<div class="qr-box">'+qr.createSvgTag(4,8)+'</div>';
      qrOK=true;
    }catch(e){errMsg=e&&e.message?e.message:"容量超限"}
  }else{
    errMsg="当前为本地文件打开，无法生成可扫码链接，请用下方「复制同步文本」+ 手机「粘贴同步码」方式。";
  }
  if(!qrOK){
    h+='<div class="sync-warn">二维码生成失败（'+(errMsg||"数据过大")+'）。当前数据量较大时二维码容量有限，请改用「导出全部数据」文件方式同步。</div>';
  }
  h+='<div class="row mt12"><button class="btn btn-sm" data-action="copy-sync-link">复制同步链接</button>'+(qrOK?'<button class="btn btn-sm btn-ghost" data-action="copy-sync-text">复制同步文本</button>':'')+'</div>';
  h+='<input id="sync-payload" type="hidden" value="'+esc(payload)+'">';
  if(!qrOK){
    h+='<div class="field mt12"><label>同步文本（数据过大时复制，到手机「粘贴同步码」导入）</label><textarea id="sync-text" readonly style="width:100%;height:90px;font-size:11px;font-family:monospace">'+esc(compressed)+'</textarea></div>';
  }
  h+='<div class="muted mt12">若扫码后未自动跳转，可复制链接/文本，在手机上用「粘贴同步码导入」。</div>';
  h+='</div>';
  openSheet(h);
}
function copyText(txt){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){toast("已复制")},function(){fallbackCopy(txt)});
  }else fallbackCopy(txt);
}
function fallbackCopy(txt){
  var ta=document.createElement("textarea");ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");toast("已复制")}catch(e){toast("复制失败，请手动选择")}
  document.body.removeChild(ta);
}
function openSyncPaste(){
  var h='<div class="sheet-hd"><div class="t">粘贴同步码导入</div><button class="x" data-action="sheet-close">✕</button></div><div class="sheet-bd">';
  h+='<div class="sync-note">把 Mac 上「生成同步二维码」里复制的<b>链接</b>或<b>同步文本</b>粘贴到下面，点击导入。导入将覆盖当前数据。</div>';
  h+='<textarea id="paste-sync" placeholder="粘贴同步链接或同步文本…" style="width:100%;height:150px;padding:10px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-family:monospace"></textarea>';
  h+='<div class="mt12"><button class="btn btn-block" data-action="paste-sync-do">导入</button></div>';

}
function doPasteSync(){
  var v=$("#paste-sync").value.trim();
  if(!v){toast("请先粘贴同步码");return}
  var m=v.match(/#sync=([^&\s]+)/);
  var code=m?m[1]:v;
  var d=syncDecompress(code);
  if(!d){alert("同步码无效或已损坏");return}
  if(!confirm("导入将覆盖当前全部数据，确定继续？"))return;
  store.data=d;store.save();closeSheet();state.view="home";state.pid=null;render();toast("同步导入成功");
}
function tryHashSync(){
  var h=location.hash||"";
  var m=h.match(/#sync=([^&\s]+)/);
  if(!m)return;
  if(history.replaceState)history.replaceState(null,"",location.pathname);else location.hash="";
  var d=syncDecompress(m[1]);
  if(!d){toast("同步数据无效");return}
  if(store.data.patients&&store.data.patients.length){
    if(!confirm("检测到来自其他设备的同步数据，导入将覆盖当前全部数据，是否继续？"))return;
  }
  store.data=d;store.save();toast("已从二维码同步导入");
}

  h+='<table><thead><tr><th style="width:56px">日期</th><th style="width:28px">时间</th>';
  var pmeds=p.meds.filter(function(m){return !m.hidden});
  for(var i=0;i<pmeds.length;i++){
    var pm=pmeds[i];
    h+='<th><div class="dc">'+esc(pm.name)+'</div><div style="font-size:9px;font-weight:400">'+esc(medSub(pm))+'</div></th>';
  }
  h+='</tr></thead><tbody>';
  for(var di=0;di<tl.dates.length;di++){
    var d=tl.dates[di];
    var row=tl.rowMap[d]||null;
    var tdmOnDate=tl.tdmMap[d]||null;
    var subRows=tdmOnDate?4:3;
    for(var s=0;s<3;s++){
      h+='<tr>';
      if(s===0)h+='<td rowspan="'+subRows+'">'+esc(d)+'</td>';
      h+='<td>'+SLOTS[s].t+'</td>';
      for(var mi=0;mi<pmeds.length;mi++){
        var med=pmeds[mi];
        var cell=(row&&row.cells&&row.cells[med.id])?row.cells[med.id][SLOTS[s].k]:"";
        var tdCls="";
        if(cell==="停")tdCls=' class="stopc"';
        else if(!cell&&tl.stopState[med.id][di])tdCls=' class="stopped"';
        h+='<td'+tdCls+'>'+esc(cell||"")+'</td>';
      }
      h+='</tr>';
    }
    if(tdmOnDate){
      h+='<tr><td>血</td>';
      var seenTdmP={};
      for(var bi=0;bi<pmeds.length;bi++){
        var bmed=pmeds[bi];
        var recs=tdmOnDate[bmed.name];
        if(recs&&recs.length&&!seenTdmP[bmed.name]){
          seenTdmP[bmed.name]=true;
          var cls2=tdmClass(bmed.name,recs);
          var bc=cls2==="high"?' class="high"':(cls2==="low"?' class="low"':(cls2==="ok"?' class="okc"':""));
          var vals=recs.map(function(t){return t.value+t.u}).join("；");
          h+='<td'+bc+'>'+esc(vals)+'</td>';
        }else h+='<td></td>';
      }
      h+='</tr>';
    }
  }
  h+='</tbody></table>';
  h+='<div class="plegend">注：红底＝停药及停用期间；「血」行为血药浓度：红=偏高，蓝=偏低，绿=正常。</div>';
  if(p.tdm&&p.tdm.length){
    h+='<div class="tdm-line"><b>血药浓度监测：</b>';
    var tdmSorted=p.tdm.slice().sort(function(a,b){return a.date<b.date?-1:1});
    h+=tdmSorted.map(function(t){return esc(t.med)+" "+esc(t.date)+" "+esc(t.value)+esc(t.u)}).join("；")+'</div>';
  }
  $("#print-root").innerHTML=h;
  window.print();
}

/* ==================== 事件委托 ==================== */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-action]");
  if(!t){
    if(e.target.id==="overlay")closeSheet();
    return;
  }
  var act=t.getAttribute("data-action");
  switch(act){
    case "sheet-close":closeSheet();break;
    case "nav-home":state.view="home";state.pid=null;render();break;
    case "add-patient":openPatientForm(null);break;
    case "add-patient-dept":openPatientForm(null,{orgName:t.getAttribute("data-org"),deptName:t.getAttribute("data-dept")});break;
    case "toggle-org":
      var oid=t.getAttribute("data-oid");
      state.collapsed["org:"+oid]=!state.collapsed["org:"+oid];
      renderPatientList();
      break;
    case "toggle-dept":
      var doid=t.getAttribute("data-oid"),ddid=t.getAttribute("data-did");
      state.collapsed["dept:"+doid+":"+ddid]=!state.collapsed["dept:"+doid+":"+ddid];
      renderPatientList();
      break;
    case "edit-patient":openPatientForm(t.getAttribute("data-pid"));break;
    case "open-patient":state.pid=t.getAttribute("data-pid");state.view="patient";state.tab="grid";render();break;
    case "patient-save":savePatient(t.getAttribute("data-pid")||null);break;
    case "del-patient":delPatient(t.getAttribute("data-pid"));break;
    case "tr-open":openTransferSheet(t.getAttribute("data-pid"),t.getAttribute("data-mode"));break;
    case "tr-mode":state.trMode=t.getAttribute("data-v");refreshTransferSheet(t.getAttribute("data-pid"));break;
    case "tr-save":saveTransfer(t.getAttribute("data-pid"));break;
    case "archive-toggle":toggleArchive(t.getAttribute("data-pid"),t.getAttribute("data-v")==="1");break;
    case "diag-toggle":{
      t.classList.toggle("on");
      /* 同一诊断可能同时出现在「常用诊断」与分类树里，状态需同步 */
      var dOn=t.classList.contains("on"),dName=t.getAttribute("data-name");
      var dcs=document.querySelectorAll("#pf-diags .chip");
      for(var dq=0;dq<dcs.length;dq++){
        if(dcs[dq]===t||dcs[dq].getAttribute("data-name")!==dName)continue;
        if(dOn)dcs[dq].classList.add("on");else dcs[dq].classList.remove("on");
      }
    }break;
    case "diag-cat-toggle":{var row=t.closest(".diag-cat-row");if(row)row.classList.toggle("collapsed");break;}
    case "care-type":{
      var cg=t.parentNode,cc=cg.querySelectorAll(".chip");
      for(var ci=0;ci<cc.length;ci++)cc[ci].classList.remove("on");
      t.classList.add("on");updateCareUI();break;
    }
    case "dept-type":{
      var dg=t.parentNode,dc=dg.querySelectorAll(".chip");
      for(var di2=0;di2<dc.length;di2++)dc[di2].classList.remove("on");
      t.classList.add("on");updateCareUI();break;
    }
    case "diag-add":addCustomDiag(t.closest(".sheet").querySelector("[data-action='patient-save']").getAttribute("data-pid")||null);break;
    case "tab":state.tab=t.getAttribute("data-tab");render();break;
    case "add-date":openAddDate();break;
    case "date-save":saveNewDate();break;
    case "date-cell":openDateSheet(t.getAttribute("data-rid"));break;
    case "row-date-save":saveRowDate(t.getAttribute("data-rid"));break;
    case "row-del":delRow(t.getAttribute("data-rid"));break;
    case "row-create":
      var rp=getPatient(state.pid);
      rp.rows.push({id:uid(),date:t.getAttribute("data-date"),cells:{}});
      rp.rows.sort(function(a,b){return a.date<b.date?-1:1});
      touch(rp);closeSheet();render();toast("已添加");
      break;
    case "tdm-cell":state.tab="tdm";render();break;
    case "add-med":openAddMed();break;
    case "med-pick":openMedConfig(t.getAttribute("data-name"));break;
    case "med-custom":var cv=$("#am-custom").value.trim();if(cv)openMedConfig(cv);break;
    case "med-confirm":confirmAddMed(t.getAttribute("data-name"));break;
    case "med-combo-pick":{
      var form=t.getAttribute("data-form")||"";
      var strength=t.getAttribute("data-strength")||"";
      var freq=t.getAttribute("data-freq")||"";
      var route=t.getAttribute("data-route")||"";
      /* 新增（mc-）与编辑（mh-）两套表单都要支持 */
      var pf=medFld("form"),ps=medFld("strength");
      if(pf)pf.value=form;
      if(ps)ps.value=strength;
      if(freq){var sel=medFld("freq");if(sel)sel.value=freq;}
      if(route){var sel2=medFld("route");if(sel2)sel2.value=route;}
      toast("已采纳常用组合");
    }break;
    case "med-field-pick":{
      var key=t.getAttribute("data-key"),val=t.getAttribute("data-val")||"";
      var fld=medFld(key);if(fld)fld.value=val;
    }break;
    case "orgdept-pick":{
      var oname=t.getAttribute("data-org")||"",dname=t.getAttribute("data-dept")||"";
      var oS=$("#pf-org"),dS=$("#pf-dept"),oN=$("#pf-org-new"),dN=$("#pf-dept-new");
      if(oS){oS.value=oname;if(oN){oN.style.display="none";oN.value=""}}
      fillDepts(oname);
      if(dS){dS.value=dname;if(dN){dN.style.display="none";dN.value=""}}
      var dt=$("#pf-dept-type");if(dt)dt.style.display="none";
      updateCareUI();
      var sib=t.parentNode.querySelectorAll(".med-sg-combo");
      for(var si=0;si<sib.length;si++)sib[si].classList.remove("on");
      t.classList.add("on");
    }break;
    case "drug-lib-mgr":openDrugLibMgr();break;
    case "del-user-drug":{
      var dn=t.getAttribute("data-name");
      if(!confirm("从药品库删除「"+dn+"」？已录入服药单中的该药不受影响。"))break;
      delUserDrug(dn);closeSheet();openDrugLibMgr();toast("已删除");
      break;
    }
    case "med-head":openMedSheet(t.getAttribute("data-mid"));break;
    case "med-save":saveMedSheet(t.getAttribute("data-mid"));break;
    case "med-move":moveMed(t.getAttribute("data-mid"),t.getAttribute("data-dir"));break;
    case "med-del":delMed(t.getAttribute("data-mid"));break;
    case "med-goto-tdm":openTdmForm(t.getAttribute("data-name"));break;
    case "med-toggle-hide":toggleMedHide(t.getAttribute("data-mid"));break;
    case "cell":openCellSheet(t.getAttribute("data-rid"),t.getAttribute("data-mid"),t.getAttribute("data-slot"));break;
    case "chip-dose":setCell(t.getAttribute("data-val"));break;
    case "cell-custom-save":var v=$("#cell-custom").value.trim();setCell(v);break;
    case "add-tdm":openTdmForm(null);break;
    case "tdm-edit":openTdmForm(null,t.getAttribute("data-tid"));break;
    case "tdm-save":saveTdm();break;
    case "tdmnote-pick":{var tn=$("#td-note");if(tn)tn.value=t.getAttribute("data-val")||"";}break;
    case "tdm-del":delTdm(t.getAttribute("data-tid"));break;
    case "data-menu":openDataSheet();break;
    case "hosp-save":store.data.hospital=$("#dm-hosp").value.trim();store.save();toast("已保存");openDataSheet();break;
    case "export-json":exportJSON();break;
    case "import-json":$("#import-file").click();break;
    case "gen-sync":openSyncGen();break;
    case "sync-paste":openSyncPaste();break;
    case "paste-sync-do":doPasteSync();break;
    case "copy-sync-link":copyText($("#sync-payload").value);break;
    case "copy-sync-text":copyText($("#sync-text").value);break;
    case "load-demo":loadDemo();break;
    case "print-grid":printGrid();break;
    case "adm-add":{
      var al=$("#adm-list");
      if(al){var c=al.querySelectorAll(".adm-row").length;al.insertAdjacentHTML("beforeend",admRowHTML({id:uid(),bed:"",admit:today(),status:"在院",discharge:"",kind:c?"换床":"入院"},c))}
      break;
    }
    case "adm-del":{
      var ar=t.closest(".adm-row");
      if(ar&&ar.parentNode)ar.parentNode.removeChild(ar);
      break;
    }
    /* ---------- 多账号 ---------- */
    case "acct-enter":{
      var eid=t.getAttribute("data-id");var ea=accounts.get(eid);
      if(!ea)break;
      if(ea.pin)openPinSheet(eid);else enterAccount(eid,true);
      break;
    }
    case "acct-new":openNewAccount();break;
    case "acct-create":{
      var nm=$("#acct-name").value.trim();
      if(!nm){toast("请填写账号名称");break;}
      accounts.add(nm,$("#acct-pin").value);
      closeSheet();
      store.load();
      store.save();
      state.view="home";state.pid=null;render();
      tryHashSync();
      toast("已创建账号："+nm);
      break;
    }
    case "pin-enter":{
      var pid=t.getAttribute("data-id");var pa=accounts.get(pid);
      var pv=$("#pin-input")?$("#pin-input").value:"";
      if(!pa)break;
      if(pa.pin&&pv!==pa.pin){var pe=$("#pin-err");if(pe)pe.textContent="密码错误，请重试";break;}
      enterAccount(pid,true);
      break;
    }
    case "acct-switch":closeSheet();renderAccountScreen();break;
    case "acct-manage":openAccountManage();break;
    case "acct-rename":{
      var rid=t.getAttribute("data-id");var ra=accounts.get(rid);
      if(!ra)break;
      var rnm=prompt("修改账号名称",ra.name);
      if(rnm&&rnm.trim()){ra.name=rnm.trim();accounts.save();openAccountManage();toast("已改名")}
      break;
    }
    case "acct-setpin":openSetPinSheet(t.getAttribute("data-id"));break;
    case "sp-save":{
      var sid=t.getAttribute("data-id");var sv=$("#sp-pin")?$("#sp-pin").value:"";
      accounts.setPin(sid,sv);openAccountManage();toast(sv?"已设置密码":"已取消密码");
      break;
    }
    case "acct-del":{
      var did=t.getAttribute("data-id");var da=accounts.get(did);
      if(!da)break;
      if(!confirm("删除账号「"+da.name+"」将永久清除其全部病人数据，确定？"))break;
      var wasCur=(accounts.current===did);
      accounts.del(did);
      closeSheet();
      if(wasCur||!accounts.current)renderAccountScreen();
      else{openAccountManage();toast("已删除")}
      break;
    }
    case "ocr-open":openOcrSheet();break;
    case "ocr-save":{
      var oc={provider:($("#ocr-provider")?$("#ocr-provider").value:""),baseUrl:($("#ocr-baseurl")?$("#ocr-baseurl").value:"").trim(),model:($("#ocr-model")?$("#ocr-model").value:"").trim(),apiKey:($("#ocr-key")?$("#ocr-key").value:"").trim()};
      setOcrCfg(oc);toast("已保存识别设置");openOcrSheet();
      break;
    }
    case "ocr-grid":openOcrPicker("grid");break;
    case "ocr-cap":pickOcrPhoto(true);break;
    case "ocr-pick":pickOcrPhoto(false);break;
    case "ocr-grid-apply":applyOcrGrid(state.ocrGrid);break;
    case "ocr-med-rm":{var ri=parseInt(t.getAttribute("data-i"));if(state.ocrGrid&&state.ocrGrid.meds)state.ocrGrid.meds.splice(ri,1);renderOcrGridReview(state.ocrGrid);break;}
    case "scale-new":openScaleList();break;
    case "scale-pick":openScaleSheet(t.getAttribute("data-scale"));break;
    case "scale-save":saveScale(t.getAttribute("data-scale"));break;
    case "scale-open":openScaleDetail(t.getAttribute("data-aid"));break;
    case "scale-print":printScale(t.getAttribute("data-aid"));break;
    case "scale-del":delScale(t.getAttribute("data-aid"));break;
    case "scale-edit":openScaleEdit(t.getAttribute("data-aid"));break;
    case "ocr-scale":openOcrPicker("scale",t.getAttribute("data-scale"));break;
    case "ocr-scale-retry":openOcrPicker("scale",state.ocrScale);break;
  }
});

function interpretScale(s,rec){
  if(!rec)rec={};

function robustParseJSON(text){
  if(!text)return null;
  var m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
  var s=m?m[1]:text;
  var a=s.indexOf("{");var b=s.lastIndexOf("}");
  if(a>=0&&b>a)s=s.slice(a,b+1);
  try{return JSON.parse(s)}catch(e){return null}
}
function fetchVision(prompt,imgB64,onDone,onErr){
  var cfg=getOcrCfg();
  if(!cfg||!cfg.apiKey||!cfg.baseUrl||!cfg.model){onErr&&onErr("尚未配置识别API，请先到「数据管理 → 识别设置」填写 Key 与接口");return}
  var body={model:cfg.model,messages:[
    {role:"system",content:"你是精神科临床文书助手，负责把医疗表单图片结构化抽取为JSON。只输出JSON，不要任何解释。"},
    {role:"user",content:[
      {type:"text",text:prompt},
      {type:"image_url",image_url:{url:"data:image/jpeg;base64,"+imgB64}}
    ]}
  ],temperature:0.1};
  fetch(cfg.baseUrl.replace(/\/$/,"")+"/chat/completions",{
    method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey},
    body:JSON.stringify(body)
  }).then(function(r){return r.json()}).then(function(j){
    if(j.error){onErr&&onErr("识别失败："+(j.error.message||JSON.stringify(j.error)));return}
    var c=j.choices&&j.choices[0]&&j.choices[0].message;
    var txt=c&&c.content;
    if(!txt){onErr&&onErr("识别返回为空，请重试或手动录入");return}
    var obj=robustParseJSON(txt);
    if(!obj){onErr&&onErr("识别结果无法解析为JSON，请重试或手动录入");return}
    onDone(obj);
  }).catch(function(e){onErr&&onErr("请求失败："+e.message)});
}

/* 相机/相册输入：每次新建 input，避免复用导致部分浏览器（微信/iOS）无法再次唤起相机 */
function pickOcrPhoto(withCapture){
  var inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";inp.style.display="none";
  if(withCapture)inp.setAttribute("capture","environment");
  inp.addEventListener("change",onOcrFile);
  document.body.appendChild(inp);
  try{inp.click()}catch(e){toast("无法打开相机/相册，请检查浏览器相机权限")}
  /* 60 秒后自动移除，避免堆积 */
  setTimeout(function(){if(inp&&inp.parentNode)inp.parentNode.removeChild(inp)},60000);
}
function onOcrFile(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var b64=(rd.result.split(",")[1])||"";
    state.ocrImg=b64;
    var cfg=getOcrCfg();
    var ready=cfg&&cfg.apiKey&&cfg.baseUrl&&cfg.model;
    if(!ready){
      /* API 未配置：仍把照片显示出来，提示去配置；不阻断拍照动作 */
      var img="data:image/jpeg;base64,"+b64;

        '<img src="'+img+'" style="width:100%;border-radius:10px;margin-bottom:10px">'+
        '<div class="muted mb12" style="color:#c2410c">⚠ 尚未配置识别 API，无法自动抽取药物/量表数据。请到「数据管理 → 识别设置」填写 API Key 后重新拍照。</div>'+
        '<button class="btn btn-block mb8" data-action="ocr-open">⚙ 前往识别设置</button>'+
        '<button class="btn btn-ghost btn-block" data-action="sheet-close">关闭</button>'+
        '</div>';

      return;
    }
    if(state.ocrKind==="grid")openOcrReviewGrid();

}

function findMedBySig(p,name,form,strength){
  for(var i=0;i<p.meds.length;i++){var m=p.meds[i];if(m.name===name&&(m.form||"")===(form||"")&&(m.strength||"")===(strength||""))return m}
  return null;
}
function upsertMed(p,name,form,strength,route,freq){
  var ex=findMedBySig(p,name,form,strength);
  if(ex){
    if(route&&!ex.route)ex.route=route;
    if(freq&&!ex.freq)ex.freq=freq;
    return ex;
  }
  var lib=findDrug(name);
  var m={id:uid(),name:name,form:form||"",strength:strength||"",route:route||"",freq:freq||"",doses:lib?lib.d.slice():[]};
  p.meds.push(m);ensureDrug(name);
  return m;
}
function ensureRowByDate(p,date){
  for(var i=0;i<p.rows.length;i++)if(p.rows[i].date===date)return p.rows[i];
  var r={id:uid(),date:date,cells:{}};p.rows.push(r);p.rows.sort(function(a,b){return a.date<b.date?-1:1});return r;
}
