    return;
  }
  state.ocrGrid=obj;
  var p=getPatient(state.pid);
  var h='<div class="sheet-hd"><div class="t">核对服药单</div><button class="x" data-action="sheet-close">✕</button></div><div class="sheet-bd">';
  h+='<div class="muted mb8">将写入病人「'+esc(p.name)+'」的服药单。请核对（可移除误识药物）：</div>';
  for(var i=0;i<obj.meds.length;i++){
    var m=obj.meds[i];
    h+='<div class="ocr-med"><div class="row"><b>'+esc(m.name||"未命名")+'</b>'+(m.strength?' <span class="muted">'+esc(m.strength)+'</span>':'')+(m.form?' <span class="muted">'+esc(m.form)+'</span>':'')+'<button class="btn btn-sm btn-ghost" data-action="ocr-med-rm" data-i="'+i+'">移除</button></div>';
    h+='<div class="muted" style="font-size:12px">'+esc(m.freq||"")+(m.route?' · '+esc(m.route):'')+'</div>';
    if(m.schedule&&m.schedule.length){
      h+='<table class="mini-grid"><tr><th>日期</th><th>早</th><th>中</th><th>晚</th></tr>';
      for(var d=0;d<m.schedule.length;d++){var s=m.schedule[d];h+='<tr><td>'+esc(s.date||"")+'</td><td>'+esc(s.m||"")+'</td><td>'+esc(s.n||"")+'</td><td>'+esc(s.e||"")+'</td></tr>'}
      h+='</table>';
    }
  }
  h+='<button class="btn btn-block mt12" data-action="ocr-grid-apply">确认导入服药单</button>';
  h+='<button class="btn btn-ghost btn-block mt8" data-action="ocr-grid">重新拍照</button></div>';
  openSheet(h);
}
function applyOcrGrid(obj){
  var p=getPatient(state.pid);if(!p)return;
  var added=0;
  for(var i=0;i<obj.meds.length;i++){
    var m=obj.meds[i];
    if(!m.name)continue;
    var med=upsertMed(p,m.name,m.form,m.strength,m.route,m.freq);
    if(m.schedule)for(var d=0;d<m.schedule.length;d++){
      var s=m.schedule[d];if(!s.date)continue;
      var row=ensureRowByDate(p,s.date);
      if(!row.cells[med.id])row.cells[med.id]={m:"",n:"",e:""};
      if(s.m!=null&&s.m!=="")row.cells[med.id].m=String(s.m);
      if(s.n!=null&&s.n!=="")row.cells[med.id].n=String(s.n);
      if(s.e!=null&&s.e!=="")row.cells[med.id].e=String(s.e);
    }
    added++;
  }
  touch(p);closeSheet();render();
  toast("已导入 "+added+" 种药物到服药单");
}

/* 心理测评模块 */
function renderScaleTab(p){
  var h='<div class="toolbar"><button class="btn btn-sm" data-action="scale-new">＋ 新增测评</button></div>';
  var list=(p.assessments||[]).slice().sort(function(a,b){return a.date<b.date?1:-1});
  if(!list.length){h+='<div class="empty">暂无测评记录<br><span style="font-size:12px">点击「新增测评」选择量表，可拍照识别录入</span></div>';return h;}
  for(var i=0;i<list.length;i++){
    var a=list[i];var s=scaleById(a.scale);var r=interpretScale(s,a);
    h+='<div class="scale-card" data-action="scale-open" data-aid="'+a.id+'">'+
      '<div class="row"><b>'+esc(s?s.name:a.scale)+'</b><span class="sc-date">'+esc(a.date||"")+'</span></div>'+
      '<div class="row mt4"><span class="muted">总分 '+esc(a.total!=null?a.total:"—")+(a.mean!=null?' ｜ 总均分 '+esc(a.mean):'')+'</span>'+(r.level?' <span class="lv lv-'+r.color+'">'+esc(r.level)+'</span>':'')+'</div>'+
      (r.text?'<div class="muted" style="font-size:12px">'+esc(r.text)+'</div>':'')+'</div>';
  }
  return h;
}
function openScaleList(){
  var cats={};for(var i=0;i<SCALES.length;i++){if(!cats[SCALES[i].cat])cats[SCALES[i].cat]=[];cats[SCALES[i].cat].push(SCALES[i]);}
  var h='<div class="sheet-hd"><div class="t">选择量表</div><button class="x" data-action="sheet-close">✕</button></div><div class="sheet-bd">';
  /* 常用量表置顶，免去在 24 个量表里翻找 */
  h+=sgBarHtml("💡 你常用的量表（按历史录入频次）",getScaleSuggestion(6).map(function(x){
    return {label:scaleById(x.id).name,count:x.count,attrs:{scale:x.id}};
  }),"scale-pick",{slim:true});
  for(var c in cats){
    h+='<div class="sect-t">'+esc(c)+'</div><div class="scale-pick">';
    for(var j=0;j<cats[c].length;j++)h+='<button class="chip" data-action="scale-pick" data-scale="'+cats[c][j].id+'">'+esc(cats[c][j].name)+'</button>';
    h+='</div>';
  }
  h+='</div>';openSheet(h);
}
function openScaleSheet(scaleId,prefill){
  prefill=prefill||{};
  var s=scaleById(scaleId);if(!s)return;
  var h='<div class="sheet-hd"><div class="t">'+esc(s.name)+'</div><button class="x" data-action="sheet-close">✕</button></div><div class="sheet-bd">';
  h+='<div class="muted mb8">可拍照识别自动录入，也可手动填写后保存。</div>';
  h+='<button class="btn btn-sm btn-ghost" data-action="ocr-scale" data-scale="'+s.id+'">📷 拍照/上传识别</button>';
  h+='<div class="divider"></div>';
  h+='<div class="field"><label>测评日期</label><input id="sc-date" type="date" value="'+esc(prefill.date||today())+'"></div>';
  h+='<div class="field"><label>总分'+(s.id==="sds"||s.id==="sas"?"（标准分）":(s.id==="scl90"?"（量表总分）":""))+'</label><input id="sc-total" inputmode="decimal" value="'+(prefill.total!=null?prefill.total:"")+'"></div>';
  if(s.id==="scl90")h+='<div class="field"><label>总均分（自动=总分÷90，也可手填）</label><input id="sc-mean" inputmode="decimal" value="'+(prefill.mean!=null?prefill.mean:"")+'"></div>';
  if(s.factors&&s.factors.length){
    h+='<div class="sect-t">维度分</div>';
    for(var i=0;i<s.factors.length;i++){var fk=s.factors[i];var fv=prefill.factors?prefill.factors[fk.key]:"";h+='<div class="field"><label>'+esc(fk.name)+'</label><input id="sc-f-'+fk.key+'" inputmode="decimal" value="'+(fv!=null?fv:"")+'"></div>';}
  }
  if(s.note)h+='<div class="muted mt8">'+esc(s.note)+'</div>';
  h+='<button class="btn btn-block mt12" data-action="scale-save" data-scale="'+s.id+'">保存测评</button></div>';
  openSheet(h);
  if(s.id==="scl90"){
    var te=document.getElementById("sc-total"),me=document.getElementById("sc-mean");
    if(te&&me)te.addEventListener("input",function(){var v=parseFloat(te.value);me.value=(!isNaN(v)&&te.value!=="")?(v/90).toFixed(2):"";});
  }
}
function saveScale(scaleId){
  var s=scaleById(scaleId);if(!s)return;
  var p=getPatient(state.pid);
  var rec={scale:scaleId,date:($("#sc-date")?$("#sc-date").value:"")||today(),total:parseFloat(($("#sc-total")?$("#sc-total").value:"")||"")||0,factors:{},items:{}};
  if(s.id==="scl90"){var mv=$("#sc-mean");if(mv&&mv.value!=="")rec.mean=parseFloat(mv.value)||0;}
  if(s.factors){for(var i=0;i<s.factors.length;i++){var v=$("#sc-f-"+s.factors[i].key);if(v&&v.value!=="")rec.factors[s.factors[i].key]=parseFloat(v.value)||0;}}
  if(_editScaleId){
    for(var k=0;k<p.assessments.length;k++){if(p.assessments[k].id===_editScaleId){rec.id=_editScaleId;p.assessments[k]=rec;break;}}
    _editScaleId=null;touch(p);closeSheet();render();toast("已更新测评");
  }else{
    rec.id=uid();p.assessments.push(rec);touch(p);closeSheet();render();toast("已保存测评");
  }
}
function applyOcrScale(scaleId,obj){
  var s=scaleById(scaleId);if(!s||!obj)return;
  var p=getPatient(state.pid);
  var rec={id:uid(),scale:scaleId,date:obj.date||today(),total:obj.total!=null?parseFloat(obj.total)||0:0,factors:obj.factors||{},items:obj.items||{}};
  p.assessments.push(rec);touch(p);closeSheet();render();
  toast("已保存 "+s.name+" 测评（可在列表核对/删除）");
}
function renderOcrScaleReview(obj,scaleId){applyOcrScale(scaleId,obj);}
function openScaleDetail(aid){
  var p=getPatient(state.pid);var a=null;for(var i=0;i<p.assessments.length;i++)if(p.assessments[i].id===aid)a=p.assessments[i];if(!a)return;
  var s=scaleById(a.scale);var r=interpretScale(s,a);
  var h='<div class="sheet-hd"><div class="t">'+esc(s?s.name:a.scale)+'</div><button class="x" data-action="sheet-close">✕</button></div><div class="sheet-bd">';
  h+='<div class="row"><span class="muted">日期</span><b>'+esc(a.date||"")+'</b></div>';
  h+='<div class="row mt8"><span class="muted">总分</span><b>'+esc(a.total!=null?a.total:"—")+'</b>'+(r.level?' <span class="lv lv-'+r.color+'">'+esc(r.level)+'</span>':'')+'</div>';
  if(a.mean!=null)h+='<div class="row mt4"><span class="muted">总均分</span><b>'+esc(a.mean)+'</b></div>';
  h+='<div class="muted mt8">'+esc(r.text||"")+'</div>';
  if(a.factors&&Object.keys(a.factors).length){
    h+='<div class="sect-t">维度分</div>';
    for(var k in a.factors)h+='<div class="row mt4"><span class="muted">'+esc(scaleFactorName(s,k))+'</span><b>'+esc(a.factors[k])+'</b></div>';
  }
  if(a.items&&Object.keys(a.items).length){
    h+='<div class="sect-t">条目分</div><div class="muted">'+Object.keys(a.items).map(function(k){return k+":"+a.items[k]}).join("  ")+'</div>';
  }
  h+='<div class="divider"></div><button class="btn btn-sm" data-action="scale-edit" data-aid="'+a.id+'">编辑</button> <button class="btn btn-sm" data-action="scale-print" data-aid="'+a.id+'">打印此测评单</button> <button class="btn btn-sm btn-danger" data-action="scale-del" data-aid="'+a.id+'">删除</button></div>';
  openSheet(h);
}
function openScaleEdit(aid){
  var p=getPatient(state.pid);var a=null;for(var i=0;i<p.assessments.length;i++)if(p.assessments[i].id===aid)a=p.assessments[i];if(!a)return;
  _editScaleId=a.id;
  openScaleSheet(a.scale,{date:a.date,total:a.total,factors:a.factors||{},mean:a.mean});
}
function delScale(aid){
  var p=getPatient(state.pid);for(var i=0;i<p.assessments.length;i++)if(p.assessments[i].id===aid){p.assessments.splice(i,1);break}
  touch(p);closeSheet();render();toast("已删除");
}
function printScale(aid){
  var p=getPatient(state.pid);var a=null;for(var i=0;i<p.assessments.length;i++)if(p.assessments[i].id===aid)a=p.assessments[i];if(!a)return;
  var s=scaleById(a.scale);var r=interpretScale(s,a);
  var org=getOrg(p.orgId),dept=getDept(p.orgId,p.deptId);
  var html='<html><head><meta charset="utf-8"><style>body{font-family:-apple-system,"PingFang SC",sans-serif;padding:28px;color:#222}'+
    'h2{margin:0 0 4px}.sub{color:#666;font-size:13px;margin-bottom:16px}.kv{display:flex;justify-content:space-between;border-bottom:1px dashed #ddd;padding:8px 0}'+
    '.lv{padding:2px 10px;border-radius:20px;color:#fff;font-size:13px}.lv-red{background:#c0392b}.lv-orange{background:#e67e22}.lv-amber{background:#f39c12}.lv-green{background:#27ae60}'+
    '.note{margin-top:14px;color:#555;font-size:13px}.tt{margin-top:24px;color:#999;font-size:12px}</style></head><body>'+
    '<h2>'+esc(s?s.name:a.scale)+'</h2>'+
    '<div class="sub">'+esc(org?org.name:"")+(dept?" · "+esc(dept.name):"")+' ｜ 病人：'+esc(p.name)+' ｜ 病案号：'+esc(p.recordNo||"")+'</div>'+
    '<div class="kv"><span>测评日期</span><b>'+esc(a.date||"")+'</b></div>'+
    '<div class="kv"><span>总分</span><b>'+esc(a.total!=null?a.total:"—")+' '+(r.level?'<span class="lv lv-'+r.color+'">'+esc(r.level)+'</span>':'')+'</b></div>'+
    (a.mean!=null?'<div class="kv"><span>总均分</span><b>'+esc(a.mean)+'</b></div>':'');
  if(a.factors)for(var k in a.factors)html+='<div class="kv"><span>'+esc(scaleFactorName(s,k))+'</span><b>'+esc(a.factors[k])+'</b></div>';
  html+=(r.text?'<div class="note">判读：'+esc(r.text)+'</div>':'')+(s&&s.note?'<div class="note">备注：'+esc(s.note)+'</div>':'');
  html+='<div class="tt">生成时间：'+new Date().toLocaleString()+'（判读仅供参考，请以临床判断为准）</div>';
  html+='</body></html>';
  var w=window.open("","_blank");if(!w){toast("请允许弹出窗口以打印");return}w.document.write(html);w.document.close();setTimeout(function(){w.print()},300);
}
